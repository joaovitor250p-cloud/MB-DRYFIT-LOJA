name: Preparar lojas para Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MB_CLOUDFLARE_CONFIG_JSON: ${{ vars.MB_CLOUDFLARE_CONFIG_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:hosting
      - run: npm run cloudflare:prepare
      - run: npx --no-install wrangler deploy --dry-run --config cloudflare-dist/dryfit/wrangler.json
      - run: npx --no-install wrangler deploy --dry-run --config cloudflare-dist/her/wrangler.json
      - uses: actions/upload-artifact@v4
        with:
          name: lojas-cloudflare
          path: cloudflare-dist/
          retention-days: 7
