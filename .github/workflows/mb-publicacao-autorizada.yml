name: Publicar MB Dryfit e For Her (autorizado, sem fotos)
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mb-publicacao-autorizada.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publicar-cloudflare-mb
  cancel-in-progress: false
jobs:
  preparar:
    name: Validar build parcial seguro
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cff723e5b8384fccb3d134d8a9da30bdfb62b61f
          persist-credentials: false
      - name: Buscar apenas os catálogos atualizados
        uses: actions/checkout@v4
        with:
          ref: main
          path: catalogos-atuais
          persist-credentials: false
      - name: Aplicar campanha fotográfica mantendo catálogo e vendas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for store,accent,title,kicker,desc,photo,video in [
            ('mb-dryfit','#ff7623','SEU RITMO.<br><em>SUAS REGRAS.</em>','PERFORMANCE PARA O SEU DIA.','Do treino para a vida. Encontre a peça que acompanha você.','/brand-assets/mb-gym-poster.jpg','/brand-assets/mb-gym-motion.mp4'),
            ('mb-for-her','#ef2984','SEU MOVIMENTO.<br><em>SEU ESTILO.</em>','MB FOR HER / THE MOVEMENT EDIT','Uma coleção feita para acompanhar sua energia, seu ritmo e todos os seus momentos.','https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=1400&q=85',None)
          ]:
            path=Path('stores')/store/'worker/storefront.html'
            h=path.read_text()
            assert 'mb-landing-2026' in h and 'data-my-orders' in h and 'id="catalog"' in h and 'id="marcas"' in h
            start=h.index('<section class="mb-hero mb-landing-2026')
            end=h.index('</section>',start)+len('</section>')
            previous=h[start:end]
            import re
            category=re.search(r'<div class="hero-category-links">.*?</div>',previous,re.S)
            assert category, 'Filtros de categoria devem continuar'
            vid=('<video class="mb-visual-video" muted loop playsinline preload="metadata" poster="'+photo+'" aria-hidden="true"><source src="'+video+'" type="video/mp4"></video>') if video else ''
            cta='ENCONTRE SEU MODELO' if store=='mb-dryfit' else 'VER A COLEÇÃO'
            hero=('<section class="mb-hero mb-landing-2026 mb-landing-'+('dryfit' if store=='mb-dryfit' else 'her')+' mb-visual-2026" aria-label="Coleção MB">'
                  '<img class="mb-visual-photo hero-backdrop" src="'+photo+'" alt="" fetchpriority="high" decoding="async" aria-hidden="true">'+vid+
                  '<div class="mb-visual-shade" aria-hidden="true"></div>'
                  '<div class="mb-visual-copy mb-hero-copy"><span class="mb-visual-kicker hero-eyebrow">'+kicker+'</span><h1>'+title+'</h1><p>'+desc+'</p>'
                  '<div class="mb-visual-actions hero-actions"><a href="#colecao" class="solid-cta">'+cta+' <span aria-hidden="true">↗</span></a>'
                  '<a href="#marcas" class="hero-secondary">EXPLORAR MARCAS <span aria-hidden="true">→</span></a></div></div>'
                  '<div class="mb-visual-bottom">'+category.group()+'</div>'+
                  ('<div class="mb-editorial-photo mb-visual-hidden"><img src="/brand-assets/mb-gym-poster.jpg" alt="" aria-hidden="true"><div class="mb-editorial-orange"></div></div>' if store=='mb-dryfit' else '<div class="mb-her-editorial-scene mb-visual-hidden">FEITA PARA SE SENTIR INCRÍVEL.</div>')+
                  '</section>')
            h=h[:start]+hero+h[end:]
            css="""
          /* Photo-based MB visual design 2026. The live catalog and shopping logic are untouched. */
          @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');
          .announcement{display:none!important}
          .campaign-header{background:#fff!important;color:#15161a!important}
          .campaign-header .logo,.campaign-header .shop-tool{color:#15161a!important}
          .mb-hero.mb-visual-2026{--visual-accent:ACCENT;position:relative!important;isolation:isolate!important;display:flex!important;flex-direction:column!important;justify-content:space-between!important;gap:0!important;max-width:none!important;min-height:640px!important;padding:0!important;background:#0b0c10!important;color:#fff!important;overflow:hidden!important}
          .mb-hero.mb-visual-2026:before,.mb-hero.mb-visual-2026:after{content:none!important;display:none!important}
          .mb-visual-2026>.mb-visual-photo,.mb-visual-2026>.mb-visual-video{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:65% center!important;z-index:-3!important;pointer-events:none}
          .mb-visual-2026>.mb-visual-video{z-index:-2!important}
          .mb-visual-hidden{display:none!important}.mb-visual-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#07090df0 0%,#07090db8 42%,#07090d3b 100%),linear-gradient(0deg,#07090ddb,transparent 40%);pointer-events:none}
          .mb-visual-copy{position:relative;z-index:1;max-width:790px;padding:92px clamp(24px,6vw,100px) 85px;margin:auto 0!important}
          .mb-visual-kicker{display:block;color:#fff;font:700 11px/1.5 'DM Sans',Arial,sans-serif;letter-spacing:.17em}
          .mb-visual-kicker:before{content:'';display:inline-block;background:var(--visual-accent);height:3px;width:34px;margin-right:15px;vertical-align:middle}
          .mb-visual-2026 h1{font:800 clamp(53px,7.6vw,105px)/1.04 'DM Sans',Arial,sans-serif!important;letter-spacing:-.06em!important;margin:24px 0 22px!important;color:#fff!important}
          .mb-visual-2026 h1 em{color:var(--visual-accent)!important;font-style:normal!important}
          .mb-visual-copy>p{font:400 clamp(14px,1.4vw,19px)/1.6 'DM Sans',Arial,sans-serif!important;color:#f7f7f7!important;max-width:400px!important;margin:0 0 28px!important}
          .mb-visual-actions{display:flex;align-items:center;gap:17px 24px;flex-wrap:wrap}
          .mb-visual-actions .solid-cta{background:var(--visual-accent)!important;color:#fff!important;border-radius:5px!important;display:inline-flex;align-items:center;gap:21px;min-height:52px;padding:15px 23px!important;font:800 12px 'DM Sans',Arial,sans-serif!important;text-decoration:none}
          .mb-visual-actions .hero-secondary{color:#fff!important;font:700 12px 'DM Sans',Arial,sans-serif!important;text-decoration:none}
          .mb-visual-bottom{position:relative;z-index:2;min-height:76px;background:#0b0d10e8;border-top:1px solid #ffffff28;display:flex;align-items:center;justify-content:center;padding:15px 20px}
          .mb-visual-bottom .hero-category-links{display:flex;gap:12px 28px;align-items:center;justify-content:center}
          .mb-visual-bottom .hero-category-links button{font:700 11px 'DM Sans',Arial,sans-serif!important;color:#fff!important;min-height:41px;min-width:110px;border:1px solid #ffffff48!important;background:#ffffff0c!important;border-radius:5px!important;padding:11px 15px!important;cursor:pointer}
          .mb-visual-bottom .hero-category-links button:hover{border-color:var(--visual-accent)!important}
          .brand-selection.mb-brand-strip{background:#fff!important;padding-top:26px!important;padding-bottom:34px!important}
          .mb-brand-strip .brand-selection-heading h2{font:800 clamp(23px,3vw,35px) 'DM Sans',Arial,sans-serif!important;letter-spacing:-.045em;color:#17191d!important}
          .mb-brand-strip .brand-tile{background:#f5f5f6!important;border:1px solid #e6e6eb!important;color:#17191e!important;border-radius:11px!important}
          .mb-brand-strip .brand-tile[data-choose-brand="On"]{background:#f5f5f6!important}
          .mb-brand-strip .brand-tile[data-choose-brand="On"] .brand-symbol{display:none!important}
          .mb-brand-strip .brand-tile[data-choose-brand="On"]:before{content:'on';display:block;font:800 28px/1 'DM Sans',Arial,sans-serif;letter-spacing:-.17em;color:#16181e;margin-right:10px}
          @media(max-width:700px){
            .mb-hero.mb-visual-2026{min-height:570px!important}
            .mb-visual-2026>.mb-visual-photo,.mb-visual-2026>.mb-visual-video{object-position:65% center!important}
            .mb-visual-shade{background:linear-gradient(90deg,#07090ded,#07090da6 55%,#07090d42),linear-gradient(0deg,#07090dd7,transparent 50%)}
            .mb-visual-copy{padding:91px 21px 80px}
            .mb-visual-kicker{font-size:9px;letter-spacing:.13em}
            .mb-visual-kicker:before{width:22px;margin-right:8px}
            .mb-visual-2026 h1{font-size:clamp(40px,10.7vw,71px)!important;line-height:1.04!important;margin:22px 0 20px!important}
            .mb-visual-copy>p{font-size:13px!important;max-width:280px!important}
            .mb-visual-actions{gap:14px}
            .mb-visual-actions .solid-cta{min-height:48px;padding:12px 15px!important;font-size:10px!important;gap:9px}
            .mb-visual-actions .hero-secondary{font-size:10px!important}
            .mb-visual-bottom{min-height:75px;padding:12px 15px}
            .mb-visual-bottom .hero-category-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;gap:8px}
            .mb-visual-bottom .hero-category-links button{min-width:0;padding:9px 4px!important;font-size:9px!important}
          }
          @media(prefers-reduced-motion:reduce){.mb-visual-video{display:none!important}}
            """.replace('ACCENT',accent)
            h=h.replace('</style></head>',css+'</style></head>')
            path.write_text(h)
            print('Updated photographic landing; preserved catalog:',store)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:hosting
      - name: Preparar apenas o código, sem ativar R2 nem aplicar a migração 0042
        env:
          MB_RELEASE_CODE_ONLY: '1'
        run: node scripts/cloudflare-prepare.mjs cloudflare.domains.config.json
      - name: Confirmar que os dois Workers estão sem fotos e sem a migração 0042
        run: |
          node --input-type=module <<'NODE'
          import {readFile,readdir} from 'node:fs/promises';
          for(const key of ['dryfit','her']){
            const dir='cloudflare-dist/'+key;
            const config=JSON.parse(await readFile(dir+'/wrangler.json','utf8'));
            if(config.vars.MB_PHOTOS_ENABLED!=='0'||config.r2_buckets)
              throw Error('Fotos R2 não podem ser ativadas nesta publicação: '+key);
            const names=await readdir(dir+'/migrations');
            if(names.some(n=>Number(n.slice(0,4))>34))
              throw Error('Migração posterior a 0034 está incluída: '+key);
            console.log('Pré-verificação concluída para '+key+' ('+names.length+' migrações locais não aplicadas).');
          }
          NODE
  publicar:
    name: Publicar Workers da Cloudflare
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare-producao
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MB_RELEASE_CODE_ONLY: '1'
