name: Publicar MB Dryfit e For Her (autorizado, sem fotos)
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mb-publicacao-autorizada.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publicar-cloudflare-mb
  cancel-in-progress: false
jobs:
  preparar:
    name: Validar build parcial seguro
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cff723e5b8384fccb3d134d8a9da30bdfb62b61f
          persist-credentials: false
      - name: Buscar apenas os catálogos atualizados
        uses: actions/checkout@v4
        with:
          ref: main
          path: catalogos-atuais
          persist-credentials: false
      - name: Aplicar somente novo visual sobre catálogos completos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for key,accent,video in [('mb-dryfit','#ff7928','/brand-assets/mb-gym-motion.mp4'),('mb-for-her','#ed287c','https://mbdryfit.com.br/brand-assets/mb-gym-motion.mp4')]:
              path=Path('stores')/key/'worker/storefront.html'
              html=path.read_text()
              assert 'mb-landing-2026' in html and 'data-my-orders' in html and 'id="catalog"' in html
              style="""
          .mb-hero.mb-landing-2026{--cinema-accent:ACCENT;position:relative;isolation:isolate;display:flex;flex-direction:column;justify-content:space-between;min-height:610px;padding:24px clamp(20px,6vw,90px) 0;background:#080a0d!important;color:#fff!important;overflow:hidden}
          .mb-hero.mb-landing-2026:before{content:'';position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,#07090cee 0%,#07090cb3 50%,#07090c3d 100%),linear-gradient(0deg,#07090cbb,transparent 50%);pointer-events:none}
          .mb-hero.mb-landing-2026:after{display:none}
          .mb-landing-2026>.mb-cinema-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:.77;z-index:-1;pointer-events:none}
          .mb-landing-2026>.hero-topline,.mb-landing-2026>.mb-hero-copy,.mb-landing-2026>.hero-bottom{position:relative;z-index:1}
          .mb-landing-2026 .hero-curation{display:none!important}
          .mb-landing-2026 .hero-topline,.mb-landing-2026 .hero-bottom{width:100%;color:#fffc;border-color:#ffffff30}
          .mb-landing-2026 .mb-hero-copy{align-self:flex-start;max-width:690px;margin:auto 0;padding:76px 0;animation:none!important}
          .mb-landing-2026 h1{font:800 clamp(57px,7.7vw,110px)/1 'Arial',sans-serif!important;letter-spacing:-.065em;color:white!important;margin:22px 0}
          .mb-landing-2026 h1 em{color:var(--cinema-accent)!important;font-style:normal}
          .mb-landing-2026 .mb-hero-copy>p{font:400 clamp(14px,1.3vw,18px)/1.65 Arial,sans-serif;color:#fffd;max-width:385px}
          .mb-landing-2026 .solid-cta{background:var(--cinema-accent);border-radius:4px;min-height:49px;padding:17px 23px;font-weight:700}
          .mb-landing-2026 .hero-secondary,.mb-landing-2026 .hero-category-links button{color:#fff}
          @media(max-width:700px){.mb-hero.mb-landing-2026{min-height:575px;padding:15px 19px 0}.mb-landing-2026 .mb-hero-copy{padding:70px 0}.mb-landing-2026 h1{font-size:clamp(44px,11.5vw,70px)!important;line-height:1.02}.mb-landing-2026 .hero-curation{display:none!important}.mb-landing-2026 .hero-season{display:none}.mb-landing-2026 .hero-bottom>span{display:none}.mb-landing-2026 .hero-category-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}.mb-landing-2026 .hero-category-links button{padding:10px 3px;border:1px solid #ffffff45;border-radius:4px;font-size:10px}}
          @media(prefers-reduced-motion:reduce){.mb-landing-2026>.mb-cinema-video{display:none}}
              """.replace('ACCENT',accent)
              html=html.replace('</style></head>',style+'</style></head>')
              marker='<section class="mb-hero mb-landing-2026'
              i=html.index('>',html.index(marker))+1
              videotag='<video class="mb-cinema-video" muted loop playsinline preload="none" aria-hidden="true"><source src="'+video+'" type="video/mp4"></video>'
              html=html[:i]+videotag+html[i:]
              html=html.replace('</body></html>',"<script>if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&!navigator.connection?.saveData){document.querySelector('.mb-cinema-video')?.play().catch(()=>{});}</script></body></html>")
              path.write_text(html)
              print('Alterado somente a abertura',key)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:hosting
      - name: Preparar apenas o código, sem ativar R2 nem aplicar a migração 0042
        env:
          MB_RELEASE_CODE_ONLY: '1'
        run: node scripts/cloudflare-prepare.mjs cloudflare.domains.config.json
      - name: Confirmar que os dois Workers estão sem fotos e sem a migração 0042
        run: |
          node --input-type=module <<'NODE'
          import {readFile,readdir} from 'node:fs/promises';
          for(const key of ['dryfit','her']){
            const dir='cloudflare-dist/'+key;
            const config=JSON.parse(await readFile(dir+'/wrangler.json','utf8'));
            if(config.vars.MB_PHOTOS_ENABLED!=='0'||config.r2_buckets)
              throw Error('Fotos R2 não podem ser ativadas nesta publicação: '+key);
            const names=await readdir(dir+'/migrations');
            if(names.some(n=>Number(n.slice(0,4))>34))
              throw Error('Migração posterior a 0034 está incluída: '+key);
            console.log('Pré-verificação concluída para '+key+' ('+names.length+' migrações locais não aplicadas).');
          }
          NODE
  publicar:
    name: Publicar Workers da Cloudflare
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare-producao
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MB_RELEASE_CODE_ONLY: '1'
    steps:
      - name: Confirmar credencial disponibilizada pelo proprietário
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta a credencial CLOUDFLARE_API_TOKEN no environment cloudflare-producao ou nos Secrets do repositório. Cadastre-a pelo GitHub; NÃO envie a chave por chat."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: cff723e5b8384fccb3d134d8a9da30bdfb62b61f
          persist-credentials: false
      - name: Buscar apenas os catálogos atualizados
        uses: actions/checkout@v4
        with:
          ref: main
          path: catalogos-atuais
          persist-credentials: false
      - name: Incorporar somente os layouts e seus testes
        run: |
          cp catalogos-atuais/stores/mb-dryfit/worker/storefront.html stores/mb-dryfit/worker/storefront.html
          cp catalogos-atuais/stores/mb-for-her/worker/storefront.html stores/mb-for-her/worker/storefront.html
          cp catalogos-atuais/stores/mb-for-her/tests/brand-media.test.mjs stores/mb-for-her/tests/brand-media.test.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Preparar Workers existentes sem fotos nem migrações novas
        run: node scripts/cloudflare-prepare.mjs cloudflare.domains.config.json
      - name: Dry-run de ambas as lojas (sem deploy)
        run: |
          npx --no-install wrangler deploy --dry-run --config cloudflare-dist/dryfit/wrangler.json
          npx --no-install wrangler deploy --dry-run --config cloudflare-dist/her/wrangler.json
      - name: Conferir tabelas já existentes na MB Dryfit (somente leitura)
        run: npx --no-install wrangler d1 execute DB --remote --config cloudflare-dist/dryfit/wrangler.json --command "SELECT archived_at FROM products LIMIT 0; SELECT guard_count FROM model_change_events LIMIT 0; SELECT token_hash FROM staff_access_sessions LIMIT 0; SELECT viewer_id FROM shop_order_access LIMIT 0;"
      - name: Conferir tabelas já existentes na MB For Her (somente leitura)
        run: npx --no-install wrangler d1 execute DB --remote --config cloudflare-dist/her/wrangler.json --command "SELECT archived_at FROM products LIMIT 0; SELECT guard_count FROM model_change_events LIMIT 0; SELECT token_hash FROM staff_access_sessions LIMIT 0; SELECT viewer_id FROM shop_order_access LIMIT 0;"
      - name: Publicar Worker MB Dryfit sem migrar dados
        run: npx --no-install wrangler deploy --config cloudflare-dist/dryfit/wrangler.json --keep-vars
      - name: Publicar Worker MB For Her sem migrar dados
        run: npx --no-install wrangler deploy --config cloudflare-dist/her/wrangler.json --keep-vars
      - name: Testar páginas públicas das duas lojas
        run: |
          for page in https://mbdryfit.com.br/acesso https://mbdryfit.com.br/catalogo https://forher.mbdryfit.com.br/catalogo; do
            echo "Conferindo $page"
            curl --fail --location --silent --show-error --max-time 25 --user-agent "Mozilla/5.0 (compatible; MB-release-check/1.0)" --output /dev/null "$page"
          done
          echo "Publicação das duas lojas concluída, páginas responderam com HTTP 2xx/3xx."
