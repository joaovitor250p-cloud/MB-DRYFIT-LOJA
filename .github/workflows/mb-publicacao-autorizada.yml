          @media(prefers-reduced-motion:reduce){.mbw-media-item{transition:none}}
              """.replace('ACCENT',accent).replace('WASH',wash)
              html=html.replace('</style></head>',css+'</style></head>',1)
              script="""
          <script>
          (() => {
           const hero=document.querySelector('.mbw-hero'),gallery=hero?.querySelector('.mbw-media'),dots=hero?.querySelector('.mbw-dots');
           const filters=document.querySelector('#filters'),bar=document.querySelector('.mbw-categories');
           if(bar&&hero)hero.insertAdjacentElement('afterend',bar);
           if(filters){const update=()=>{for(const b of filters.querySelectorAll('button')){if(b.dataset.mbwReady)continue;const key=String(b.dataset.category||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase();const mark=key.includes('camis')?'♧':key.includes('bermud')||key.includes('short')?'▱':key.includes('calc')||key.includes('legg')?'♙':key.includes('conjun')?'▣':key.includes('top')?'♡':key.includes('import')?'✈':'◇';b.textContent=mark+'  '+b.textContent;b.dataset.mbwReady='1'}};new MutationObserver(update).observe(filters,{childList:true});update()}
           if(!hero||!gallery||!dots)return;
           let slides=[],index=0,timer;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
           const valid=url=>{try{const u=new URL(url,location.origin);return u.protocol==='https:'||u.origin===location.origin&&u.protocol==='http:'}catch{return false}};
           function show(i){index=i;slides.forEach((el,j)=>{const active=i===j;el.classList.toggle('active',active);const v=el.querySelector('video');if(v){if(active&&!reduced&&!document.hidden&&!navigator.connection?.saveData)v.play().catch(()=>{});else v.pause()}});[...dots.children].forEach((d,j)=>d.setAttribute('aria-current',String(i===j)))}
           function apply(settings){
             if(!settings||typeof settings!=='object')return;
             clearInterval(timer);index=0;slides=[];gallery.replaceChildren();dots.replaceChildren();
             let media=[];for(let i=1;i<=5;i++){const url=settings['banner_slide_'+i+'_url'];if(typeof url==='string'&&url&&valid(url))media.push({url,video:settings['banner_slide_'+i+'_type']==='video'})}
             if(!media.length&&settings.media_url&&valid(settings.media_url))media.push({url:settings.media_url,video:settings.media_type==='video'});
             hero.classList.toggle('has-media',!!media.length);
             media.forEach((entry,i)=>{const box=document.createElement('div');box.className='mbw-media-item';const el=document.createElement(entry.video?'video':'img');el.src=entry.url;if(entry.video){el.muted=true;el.loop=true;el.playsInline=true;el.preload=i===0?'metadata':'none'}else{el.alt='Peças da coleção';el.loading=i===0?'eager':'lazy'}box.append(el);gallery.append(box);slides.push(box);const dot=document.createElement('button');dot.type='button';dot.setAttribute('aria-label','Imagem '+(i+1));dot.onclick=()=>show(i);dots.append(dot)});
             if(slides.length){show(0);if(slides.length>1&&!reduced&&!navigator.connection?.saveData)timer=setInterval(()=>{if(!document.hidden)show((index+1)%slides.length)},Math.max(4,Number(settings.banner_slide_seconds)||6)*1000)}
           }
           const preview=location.search.includes('preview=appearance');
           fetch(preview?'/api/storefront-settings':'/api/shop/appearance',{credentials:'same-origin',cache:'no-store'}).then(r=>r.ok?r.json():null).then(result=>apply(result?.published||result?.draft||result?.appearance||result)).catch(()=>{});
           addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='mb-appearance-preview')apply(e.data.appearance)});
           document.addEventListener('visibilitychange',()=>{if(document.hidden)hero.querySelectorAll('video').forEach(v=>v.pause());else if(slides.length)show(index)});
          })();
          </script>
              """
