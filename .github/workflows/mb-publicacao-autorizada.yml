                    if(kind){kind.value=upload.type.startsWith('video/')?'video':'image';kind.dispatchEvent(new Event('change',{bubbles:true}))}
                    status.textContent='Enviado ('+Math.round(upload.size/1024)+' KB). Salve o rascunho e publique.';
                  }catch(e){status.textContent=e.message||'Não foi possível enviar. Use um link HTTPS.'}
                  finally{button.disabled=false}
                });
                remove.onclick=()=>{url.value='';url.dispatchEvent(new Event('input',{bubbles:true}));status.textContent='Mídia retirada deste banner. Salve e publique.'};
                zone.append(file,button,remove,status);holder.after(zone);
              }
            }
