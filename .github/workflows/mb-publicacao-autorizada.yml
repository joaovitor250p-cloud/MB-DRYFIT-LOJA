      - name: Garantir campo de pareamento no Worker final antes do deploy
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          for (const store of ['dryfit','her']) {
            const built=readFileSync('cloudflare-dist/'+store+'/worker.js','utf8');
            for (const term of ['mbPrinterToken','function mountDirectPrinter','function reviewLabelBatch','mbBridgeRequest','Salvar e conectar uma vez','mbPrinterConnectedPanel','/downloads/mb-impressao-elgin-windows.zip','Tutorial de instalação em computador novo','function mbPrinterAllowPaint()','Preparando lista:']) {
              if(!built.includes(term))throw Error(store+': campo ou integração de impressão ausente no Worker final: '+term);
            }
            const mountBeforeGrid='mountDirectPrinter();drawLabelModels();previewLabels()}';
            const lateMount='drawLabelModels();previewLabels();mountDirectPrinter()}';
            if(!built.includes(mountBeforeGrid)||built.includes(lateMount))throw Error(store+': montagem da conexão da Elgin não ocorre primeiro');
            console.log('CONFIRMADO no Worker final da loja '+store+': campo de código, conector local e conferência do lote.');
          }
          NODE
      - name: Verificar ou criar R2 separado por loja e habilitar somente o binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Falta CLOUDFLARE_R2_API_TOKEN no ambiente cloudflare-producao'; exit 1; }
          node catalogos-atuais/scripts/activate-r2.mjs
      - name: Testar gravação e leitura no R2 com arquivos temporários
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          printf 'MB-R2-HEALTH-CHECK\n' > "$temp/smoke.txt"
          for loja in dryfit her; do
            if [ "$loja" = dryfit ]; then bucket="mb-dryfit-fotos"; else bucket="mb-for-her-fotos"; fi
            key="_mb-r2-health/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
            npx --no-install wrangler r2 object put "$bucket/$key" --file "$temp/smoke.txt" --remote
            npx --no-install wrangler r2 object get "$bucket/$key" --file "$temp/received.txt" --remote
            cmp "$temp/smoke.txt" "$temp/received.txt"
            npx --no-install wrangler r2 object delete "$bucket/$key" --remote
            rm -f "$temp/received.txt"
            echo "Leitura e escrita R2 aprovadas para $loja"
          done
