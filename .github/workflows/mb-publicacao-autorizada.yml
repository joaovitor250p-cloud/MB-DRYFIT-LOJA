name: Publicar MB Dryfit e For Her (autorizado, sem fotos)
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mb-publicacao-autorizada.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publicar-cloudflare-mb
  cancel-in-progress: false
jobs:
  preparar:
    name: Validar build parcial seguro
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cff723e5b8384fccb3d134d8a9da30bdfb62b61f
          persist-credentials: false
      - name: Buscar apenas os catálogos atualizados
        uses: actions/checkout@v4
        with:
          ref: main
          path: catalogos-atuais
          persist-credentials: false
      - name: Instalar codificador de frames para vídeos leves
        run: python3 -m pip install --quiet Pillow
      - name: Aplicar campanha fotográfica mantendo catálogo e vendas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for store,accent,title,kicker,desc,photo,video in [
            ('mb-dryfit','#ff7623','SEU RITMO.<br><em>SUAS REGRAS.</em>','PERFORMANCE PARA O SEU DIA.','Do treino para a vida. Encontre a peça que acompanha você.','/brand-assets/mb-male-exercise.webp',None),
            ('mb-for-her','#ef2984','SEU MOVIMENTO.<br><em>SEU ESTILO.</em>','MB FOR HER / THE MOVEMENT EDIT','Uma coleção feita para acompanhar sua energia, seu ritmo e todos os seus momentos.','/brand-assets/mb-female-exercise.webp',None)
          ]:
            # Ship original silent workout animations as local Worker assets, no external CDN.
            animation_file='mb-male-exercise.webp' if store=='mb-dryfit' else 'mb-female-exercise.webp'
            source_animation=Path('catalogos-atuais/stores')/store/'brand-assets'/animation_file
            dest_animation=Path('stores')/store/'brand-assets'/animation_file
            asset_data=source_animation.read_bytes()
            assert asset_data[:4]==b'RIFF' and len(asset_data)>5000, 'Animated WebP asset missing'
            dest_animation.write_bytes(asset_data)
            # Convert the 4-frame animated WebP into a small hardware-decoded H.264 loop.
            # Create 6 ping-pong frames; frame blending avoids the visible 4-frame stutter.
            from PIL import Image
            from pathlib import Path
            import tempfile,subprocess
            with Image.open(source_animation) as img:
              n=getattr(img,'n_frames',1)
              assert n>=3 and n<=24
              with tempfile.TemporaryDirectory() as tmp:
                indexes=list(range(n))+list(range(n-2,0,-1))
                for j,k in enumerate(indexes):
                  img.seek(k)
                  rgb=img.convert('RGB')
                  rgb.save(Path(tmp)/('frame%02d.png'%j))
                  if j==0:
                    poster_name='mb-'+('male' if store=='mb-dryfit' else 'female')+'-exercise-poster.jpg'
                    rgb.save(Path('stores')/store/'brand-assets'/poster_name,quality=83,optimize=True)
                video_name='mb-'+('male' if store=='mb-dryfit' else 'female')+'-exercise-loop.mp4'
                video_dest=Path('stores')/store/'brand-assets'/video_name
                subprocess.run(['ffmpeg','-y','-loglevel','error','-framerate','4','-i',str(Path(tmp)/'frame%02d.png'),
                   '-vf','minterpolate=fps=20:mi_mode=blend,scale=600:-2:flags=bicubic,format=yuv420p',
                   '-an','-c:v','libx264','-preset','veryfast','-crf','27','-movflags','+faststart',str(video_dest)],
                   check=True)
                assert 10000<video_dest.stat().st_size<1000000
            photo='/brand-assets/'+poster_name
            video='/brand-assets/'+video_name

            # Extend the existing build's brand-media bundler to include animated WebP.
            builder=Path('stores')/store/'scripts/build.mjs'
            builder_code=builder.read_text()
            assert 'jpg|mp4|svg' in builder_code and "file.endsWith('.svg')?'image/svg+xml':'image/jpeg'" in builder_code
            builder_code=builder_code.replace('jpg|mp4|svg','jpg|mp4|svg|webp').replace("file.endsWith('.svg')?'image/svg+xml':'image/jpeg'","file.endsWith('.svg')?'image/svg+xml':file.endsWith('.webp')?'image/webp':'image/jpeg'")
            builder.write_text(builder_code)
            path=Path('stores')/store/'worker/storefront.html'
            h=path.read_text()
            assert 'mb-landing-2026' in h and 'data-my-orders' in h and 'id="catalog"' in h and 'id="marcas"' in h
            start=h.index('<section class="mb-hero mb-landing-2026')
            end=h.index('</section>',start)+len('</section>')
            previous=h[start:end]
            import re
            category=re.search(r'<div class="hero-category-links">.*?</div>',previous,re.S)
            assert category, 'Filtros de categoria devem continuar'
            vid=('<video class="mb-visual-video" muted loop playsinline preload="metadata" poster="'+photo+'" aria-hidden="true"><source src="'+video+'" type="video/mp4"></video>') if video else ''
            cta='ENCONTRE SEU MODELO' if store=='mb-dryfit' else 'VER A COLEÇÃO'
            hero=('<section class="mb-hero mb-landing-2026 mb-landing-'+('dryfit' if store=='mb-dryfit' else 'her')+' mb-visual-2026" aria-label="Coleção MB">'
                  '<img class="mb-visual-photo hero-backdrop" src="'+photo+'" alt="" fetchpriority="high" decoding="async" aria-hidden="true">'+vid+
                  '<div class="mb-visual-shade" aria-hidden="true"></div>'
                  '<div class="mb-visual-copy mb-hero-copy"><span class="mb-visual-kicker hero-eyebrow">'+kicker+'</span><h1>'+title+'</h1><p>'+desc+'</p>'
                  '<div class="mb-visual-actions hero-actions"><a href="#colecao" class="solid-cta">'+cta+' <span aria-hidden="true">↗</span></a>'
                  '<a href="#marcas" class="hero-secondary">EXPLORAR MARCAS <span aria-hidden="true">→</span></a></div></div>'
                  '<div class="mb-visual-bottom">'+category.group()+'</div>'+
                  ('<div class="mb-editorial-photo mb-visual-hidden"><img src="/brand-assets/mb-gym-poster.jpg" alt="" aria-hidden="true"><div class="mb-editorial-orange"></div></div>' if store=='mb-dryfit' else '<div class="mb-her-editorial-scene mb-visual-hidden">FEITA PARA SE SENTIR INCRÍVEL.</div>')+
                  '</section>')
            # Five real brand shortcuts; preserve hidden legacy category hooks for existing tests.
            # Move the real existing brand tiles to the opening, rather than adding tiny text duplicates.
            brand_bar='<nav class="mb-visual-brands" id="heroBrands" aria-label="Filtrar por marca"></nav>'
            hero=hero.replace('<div class="mb-visual-bottom">'+category.group()+'</div>',
                              '<div class="mb-visual-bottom">'+brand_bar+'<div class="mb-original-categories-hidden" aria-hidden="true">'+category.group()+'</div></div>')
            assert hero.count('id="heroBrands"')==1
            h=h[:start]+hero+h[end:]
            css="""
          /* Photo-based MB visual design 2026. The live catalog and shopping logic are untouched. */
          @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');
          .announcement{display:none!important}
          .campaign-header{background:#fff!important;color:#15161a!important}
          .campaign-header .logo,.campaign-header .shop-tool{color:#15161a!important}
          .mb-hero.mb-visual-2026{--visual-accent:ACCENT;position:relative!important;isolation:isolate!important;display:flex!important;flex-direction:column!important;justify-content:space-between!important;gap:0!important;max-width:none!important;min-height:640px!important;padding:0!important;background:#0b0c10!important;color:#fff!important;overflow:hidden!important}
          .mb-hero.mb-visual-2026:before,.mb-hero.mb-visual-2026:after{content:none!important;display:none!important}
          .mb-visual-2026>.mb-visual-photo,.mb-visual-2026>.mb-visual-video{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:65% center!important;z-index:-3!important;pointer-events:none}
          .mb-visual-2026>.mb-visual-video{z-index:-2!important}
          .mb-visual-hidden{display:none!important}.mb-visual-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#07090df0 0%,#07090db8 42%,#07090d3b 100%),linear-gradient(0deg,#07090ddb,transparent 40%);pointer-events:none}
          .mb-visual-copy{position:relative;z-index:1;max-width:790px;padding:92px clamp(24px,6vw,100px) 85px;margin:auto 0!important}
          .mb-visual-kicker{display:block;color:#fff;font:700 11px/1.5 'DM Sans',Arial,sans-serif;letter-spacing:.17em}
          .mb-visual-kicker:before{content:'';display:inline-block;background:var(--visual-accent);height:3px;width:34px;margin-right:15px;vertical-align:middle}
          .mb-visual-2026 h1{font:800 clamp(53px,7.6vw,105px)/1.04 'DM Sans',Arial,sans-serif!important;letter-spacing:-.06em!important;margin:24px 0 22px!important;color:#fff!important}
          .mb-visual-2026 h1 em{color:var(--visual-accent)!important;font-style:normal!important}
          .mb-visual-copy>p{font:400 clamp(14px,1.4vw,19px)/1.6 'DM Sans',Arial,sans-serif!important;color:#f7f7f7!important;max-width:400px!important;margin:0 0 28px!important}
          .mb-visual-actions{display:flex;align-items:center;gap:17px 24px;flex-wrap:wrap}
          .mb-visual-actions .solid-cta{background:var(--visual-accent)!important;color:#fff!important;border-radius:5px!important;display:inline-flex;align-items:center;gap:21px;min-height:52px;padding:15px 23px!important;font:800 12px 'DM Sans',Arial,sans-serif!important;text-decoration:none}
          .mb-visual-actions .hero-secondary{color:#fff!important;font:700 12px 'DM Sans',Arial,sans-serif!important;text-decoration:none}
          .mb-visual-bottom{position:relative;z-index:2;min-height:76px;background:#0b0d10e8;border-top:1px solid #ffffff28;display:flex;align-items:center;justify-content:center;padding:15px 20px}
          .mb-visual-bottom .hero-category-links{display:flex;gap:12px 28px;align-items:center;justify-content:center}
          .mb-visual-bottom .hero-category-links button{font:700 11px 'DM Sans',Arial,sans-serif!important;color:#fff!important;min-height:41px;min-width:110px;border:1px solid #ffffff48!important;background:#ffffff0c!important;border-radius:5px!important;padding:11px 15px!important;cursor:pointer}
          .mb-visual-bottom .hero-category-links button:hover{border-color:var(--visual-accent)!important}
          .brand-selection.mb-brand-strip{background:#fff!important;padding-top:26px!important;padding-bottom:34px!important}
          .mb-brand-strip .brand-selection-heading h2{font:800 clamp(23px,3vw,35px) 'DM Sans',Arial,sans-serif!important;letter-spacing:-.045em;color:#17191d!important}
          .mb-brand-strip .brand-tile{background:#f5f5f6!important;border:1px solid #e6e6eb!important;color:#17191e!important;border-radius:11px!important}
          .mb-brand-strip .brand-tile[data-choose-brand="On"]{background:#f5f5f6!important}
          .mb-brand-strip .brand-tile[data-choose-brand="On"] .brand-symbol{display:none!important}
          .mb-brand-strip .brand-tile[data-choose-brand="On"]:before{content:'on';display:block;font:800 28px/1 'DM Sans',Arial,sans-serif;letter-spacing:-.17em;color:#16181e;margin-right:10px}
          @media(max-width:700px){
            .mb-hero.mb-visual-2026{min-height:570px!important}
            .mb-visual-2026>.mb-visual-photo,.mb-visual-2026>.mb-visual-video{object-position:65% center!important}
            .mb-visual-shade{background:linear-gradient(90deg,#07090ded,#07090da6 55%,#07090d42),linear-gradient(0deg,#07090dd7,transparent 50%)}
            .mb-visual-copy{padding:91px 21px 80px}
            .mb-visual-kicker{font-size:9px;letter-spacing:.13em}
            .mb-visual-kicker:before{width:22px;margin-right:8px}
            .mb-visual-2026 h1{font-size:clamp(40px,10.7vw,71px)!important;line-height:1.04!important;margin:22px 0 20px!important}
            .mb-visual-copy>p{font-size:13px!important;max-width:280px!important}
            .mb-visual-actions{gap:14px}
            .mb-visual-actions .solid-cta{min-height:48px;padding:12px 15px!important;font-size:10px!important;gap:9px}
            .mb-visual-actions .hero-secondary{font-size:10px!important}
            .mb-visual-bottom{min-height:75px;padding:12px 15px}
            .mb-visual-bottom .hero-category-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;gap:8px}
            .mb-visual-bottom .hero-category-links button{min-width:0;padding:9px 4px!important;font-size:9px!important}
          }
          @media(prefers-reduced-motion:reduce){.mb-visual-video{display:none!important}}
            """.replace('ACCENT',accent)
            # WebP intrinsically loops through exercise frames; do not pan the entire picture.
            css += """
          .mb-visual-2026>.mb-visual-photo{animation:none!important;object-position:54% center!important}
          .mb-visual-2026>.mb-visual-video{display:none!important}
          .mb-visual-2026>.mb-visual-shade{background:linear-gradient(90deg,#05070de0 0%,#05070da8 39%,#05070d19 100%),linear-gradient(0deg,#05070db3,transparent 50%)!important}
          @media(max-width:700px){.mb-visual-2026>.mb-visual-photo{object-position:60% center!important}}
            """
            # Keep original catalog DOM for existing tests, but remove obsolete oversized logo/about panel from display.
            css += """
          /* Last pass: hide old brand-logo panel in both storefronts. */
          .about-section,#sobre.about-section{display:none!important}
          /* Real dark moving background, not a screenshot of the proposed page. */
          .mb-hero.mb-visual-2026{width:100%!important;min-width:0!important;border-radius:0!important;box-sizing:border-box!important}
          .mb-visual-2026>.mb-visual-photo{z-index:0!important;filter:brightness(.68) contrast(1.12) saturate(.85)}
          .mb-visual-2026>.mb-visual-video{z-index:1!important;filter:brightness(.7) contrast(1.16) saturate(.85)}
          .mb-visual-2026>.mb-visual-shade{z-index:2!important;background:linear-gradient(90deg,#06070bea 0%,#06070bbd 48%,#06070b45 100%),linear-gradient(0deg,#06070be0 0%,transparent 50%)!important}
          .mb-visual-2026>.mb-visual-copy,.mb-visual-2026>.mb-visual-bottom{z-index:3!important}
          .mb-visual-2026>.mb-visual-copy{display:block!important;box-sizing:border-box!important;width:100%!important;max-width:850px!important;min-width:0!important;margin:auto 0!important;transform:none!important;left:auto!important;right:auto!important}
          .mb-visual-2026 h1{overflow-wrap:normal!important;word-break:normal!important;text-wrap:balance}
          .mb-visual-2026 .mb-visual-actions{justify-content:flex-start!important}
          .mb-visual-2026 .mb-visual-photo{animation:mbFilmPan 22s ease-in-out infinite alternate}
          @keyframes mbFilmPan{from{transform:scale(1.02) translateX(-1%)}to{transform:scale(1.11) translateX(1.5%)}}
          @media(max-width:700px){
            .mb-hero.mb-visual-2026{min-height:595px!important}
            .mb-visual-2026>.mb-visual-copy{padding:76px 22px 80px!important;max-width:100%!important}
            .mb-visual-2026 h1{font-size:clamp(33px,8.8vw,57px)!important;letter-spacing:-.055em!important;line-height:1.09!important;white-space:normal!important}
            .mb-visual-2026 .mb-visual-copy>p{max-width:295px!important}
            .mb-visual-2026>.mb-visual-photo{object-position:69% center!important}
            .mb-visual-2026>.mb-visual-video{object-position:65% center!important}
          }
          @media(prefers-reduced-motion:reduce){.mb-visual-2026 .mb-visual-photo{animation:none!important}}
          """
            css += """
          /* Five existing brands as prominent hero shortcuts; old garment shortcuts remain hidden. */
          .mb-original-categories-hidden{display:none!important}
          .mb-visual-bottom .mb-visual-brands{display:flex!important;flex-wrap:nowrap;align-items:center;justify-content:center;gap:10px;width:100%;max-width:720px}
          .mb-visual-bottom .mb-visual-brands button{color:#fff!important;background:#ffffff12!important;border:1px solid #ffffff47!important;border-radius:5px!important;min-height:43px;min-width:0;flex:1 1 0;padding:11px 8px!important;font:700 11px 'DM Sans',Arial,sans-serif!important;white-space:nowrap}
          .mb-visual-bottom .mb-visual-brands button span{color:var(--visual-accent)}
          .mb-visual-bottom .mb-visual-brands button:hover,.mb-visual-bottom .mb-visual-brands button:focus-visible{border-color:var(--visual-accent)!important;background:#ffffff24!important}
          @media(max-width:700px){.mb-visual-bottom{padding:11px 10px!important}.mb-visual-bottom .mb-visual-brands{gap:5px}.mb-visual-bottom .mb-visual-brands button{font-size:9px!important;padding:10px 2px!important}.mb-visual-bottom .mb-visual-brands button span{display:none}}
          """
            # Prevent a second brand strip, use existing logo tiles in readable, touch-friendly cards.
            css += """
          .mb-brand-strip[hidden]{display:none!important}
          .mb-visual-bottom{box-sizing:border-box!important;padding:12px 14px!important}
          #heroBrands{display:block!important;width:100%;max-width:900px;min-width:0!important;margin:auto}
          #heroBrands .brand-tile-list{display:flex!important;overflow-x:auto!important;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scrollbar-width:none;gap:10px!important;width:100%!important;padding:3px 0 6px!important}
          #heroBrands .brand-tile-list::-webkit-scrollbar{display:none}
          #heroBrands .brand-tile{flex:0 0 132px!important;min-width:132px!important;min-height:65px!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:9px!important;padding:11px 12px!important;border:1px solid #eeeeee!important;border-radius:10px!important;background:#f7f7f8!important;color:#171923!important;scroll-snap-align:start;font:700 12px 'DM Sans',Arial,sans-serif!important}
          #heroBrands .brand-tile .brand-symbol{display:inline-block!important;flex:0 0 31px!important;width:31px!important;height:26px!important;max-width:31px!important;background-size:contain!important;filter:none!important}
          #heroBrands .brand-tile[data-choose-brand="On"] .brand-symbol{display:none!important}
          #heroBrands .brand-tile[data-choose-brand="On"]:before{content:'on';font:800 27px/1 'DM Sans',Arial,sans-serif;letter-spacing:-.16em;color:#111}
          #heroBrands .brand-tile[data-choose-brand="On"]{background:#f7f7f8!important}
          #heroBrands .brand-tile:hover,#heroBrands .brand-tile.is-selected{border-color:var(--visual-accent)!important}
          .mb-visual-2026>.mb-visual-photo{animation:none!important;transform:none!important;filter:none!important}
          .mb-visual-2026>.mb-visual-video{animation:none!important;transform:none!important;filter:none!important;opacity:1!important}
          @media(max-width:700px){#heroBrands .brand-tile{flex-basis:117px!important;min-width:117px!important;min-height:63px!important;gap:7px!important;font-size:11px!important}#heroBrands .brand-tile .brand-symbol{flex-basis:27px!important;width:27px!important;height:25px!important}}
          """
            if store=='mb-dryfit':
              css += """
          .mb-visual-2026>.mb-visual-video{filter:brightness(1.32) contrast(1.05) saturate(.9)!important;opacity:1!important}
          .mb-visual-2026>.mb-visual-photo{filter:brightness(.92) contrast(1.12)!important}
          .mb-visual-2026>.mb-visual-shade{background:linear-gradient(90deg,#06070be9 0%,#06070bb8 43%,#06070b25 100%),linear-gradient(0deg,#06070bab,transparent 58%)!important}
              """
            if store=='mb-for-her':
              css += """
          .mb-visual-2026 h1{font-family:Georgia,'Times New Roman',serif!important;font-weight:700!important;letter-spacing:-.05em!important}
          .mb-visual-2026 h1 em{font-style:italic!important}
          .mb-visual-2026>.mb-visual-photo{object-position:58% 35%!important}
          .mb-visual-2026>.mb-visual-photo{filter:brightness(1.12) contrast(1.1) saturate(.9)!important;animation:mbFemaleWorkoutMotion 5.2s ease-in-out infinite alternate!important}
          @keyframes mbFemaleWorkoutMotion{0%{transform:translateY(1.5%) scale(1.05)}50%{transform:translateY(-1.5%) scale(1.09)}100%{transform:translateY(1.5%) scale(1.05)}}
          @media(prefers-reduced-motion:reduce){.mb-visual-2026>.mb-visual-photo{animation:none!important}}
          .mb-visual-2026>.mb-visual-shade{background:linear-gradient(90deg,#110c15eb 0%,#110c15c3 53%,#110c154d 100%),linear-gradient(0deg,#100b14d9,transparent 50%)!important}
          @media(max-width:700px){.mb-visual-2026 h1{font-size:clamp(33px,8.7vw,55px)!important}}
              """
            h=h.replace('</style></head>',css+'</style></head>')
            # Use the same mobile-friendly silent video player on both storefronts.
            if True:
              h=h.replace('</body></html>',"""<script>
          (() => {
            const v=document.querySelector('.mb-visual-video');
            if(!v || window.matchMedia('(prefers-reduced-motion: reduce)').matches || navigator.connection?.saveData)return;
            v.muted=true;v.loop=true;v.playsInline=true;
            const play=()=>v.play().catch(()=>{});
            if(document.visibilityState==='visible')play();
            document.addEventListener('visibilitychange',()=>{if(document.hidden)v.pause();else play()});
          })();
          </script></body></html>""")
            # One brand list in the actual DOM: relocate the five existing logo tiles without cloning.
            h=h.replace('</body></html>',"""<script>
          (() => {
            const destination=document.getElementById('heroBrands');
            const original=document.querySelector('.mb-brand-strip .brand-tile-list');
            if(destination && original) {
              destination.appendChild(original);
              const strip=document.querySelector('.mb-brand-strip');
              if(strip)strip.hidden=true;
              const explore=document.querySelector('.mb-visual-actions .hero-secondary');
              if(explore)explore.addEventListener('click',(event)=>{
                event.preventDefault();destination.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});
              });
            }
          })();
          </script></body></html>""")
            # Let the HTML video play only when visible; use static poster for low-power devices.
            h=h.replace('class="mb-visual-video" muted loop','class="mb-visual-video" muted loop')
            path.write_text(h)
            print('Updated photographic landing; preserved catalog:',store)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:hosting
      - name: Preparar apenas o código, sem ativar R2 nem aplicar a migração 0042
        env:
          MB_RELEASE_CODE_ONLY: '1'
        run: node scripts/cloudflare-prepare.mjs cloudflare.domains.config.json
      - name: Confirmar que os dois Workers estão sem fotos e sem a migração 0042
        run: |
          node --input-type=module <<'NODE'
          import {readFile,readdir} from 'node:fs/promises';
          for(const key of ['dryfit','her']){
            const dir='cloudflare-dist/'+key;
            const config=JSON.parse(await readFile(dir+'/wrangler.json','utf8'));
            if(config.vars.MB_PHOTOS_ENABLED!=='0'||config.r2_buckets)
              throw Error('Fotos R2 não podem ser ativadas nesta publicação: '+key);
            const names=await readdir(dir+'/migrations');
            if(names.some(n=>Number(n.slice(0,4))>34))
              throw Error('Migração posterior a 0034 está incluída: '+key);
            console.log('Pré-verificação concluída para '+key+' ('+names.length+' migrações locais não aplicadas).');
          }
          NODE
  publicar:
    name: Publicar Workers da Cloudflare
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare-producao
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MB_RELEASE_CODE_ONLY: '1'
    steps:
      - name: Confirmar credencial disponibilizada pelo proprietário
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta a credencial CLOUDFLARE_API_TOKEN no environment cloudflare-producao ou nos Secrets do repositório. Cadastre-a pelo GitHub; NÃO envie a chave por chat."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: cff723e5b8384fccb3d134d8a9da30bdfb62b61f
          persist-credentials: false
      - name: Buscar apenas os catálogos atualizados
        uses: actions/checkout@v4
        with:
          ref: main
          path: catalogos-atuais
          persist-credentials: false
      - name: Instalar codificador de frames para vídeos leves
        run: python3 -m pip install --quiet Pillow
      - name: Aplicar campanha fotográfica mantendo catálogo e vendas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for store,accent,title,kicker,desc,photo,video in [
            ('mb-dryfit','#ff7623','SEU RITMO.<br><em>SUAS REGRAS.</em>','PERFORMANCE PARA O SEU DIA.','Do treino para a vida. Encontre a peça que acompanha você.','/brand-assets/mb-male-exercise.webp',None),
            ('mb-for-her','#ef2984','SEU MOVIMENTO.<br><em>SEU ESTILO.</em>','MB FOR HER / THE MOVEMENT EDIT','Uma coleção feita para acompanhar sua energia, seu ritmo e todos os seus momentos.','/brand-assets/mb-female-exercise.webp',None)
          ]:
            # Ship original silent workout animations as local Worker assets, no external CDN.
            animation_file='mb-male-exercise.webp' if store=='mb-dryfit' else 'mb-female-exercise.webp'
            source_animation=Path('catalogos-atuais/stores')/store/'brand-assets'/animation_file
            dest_animation=Path('stores')/store/'brand-assets'/animation_file
            asset_data=source_animation.read_bytes()
            assert asset_data[:4]==b'RIFF' and len(asset_data)>5000, 'Animated WebP asset missing'
            dest_animation.write_bytes(asset_data)
            # Convert the 4-frame animated WebP into a small hardware-decoded H.264 loop.
            # Create 6 ping-pong frames; frame blending avoids the visible 4-frame stutter.
            from PIL import Image
            from pathlib import Path
            import tempfile,subprocess
            with Image.open(source_animation) as img:
              n=getattr(img,'n_frames',1)
              assert n>=3 and n<=24
              with tempfile.TemporaryDirectory() as tmp:
                indexes=list(range(n))+list(range(n-2,0,-1))
                for j,k in enumerate(indexes):
                  img.seek(k)
                  rgb=img.convert('RGB')
                  rgb.save(Path(tmp)/('frame%02d.png'%j))
                  if j==0:
                    poster_name='mb-'+('male' if store=='mb-dryfit' else 'female')+'-exercise-poster.jpg'
                    rgb.save(Path('stores')/store/'brand-assets'/poster_name,quality=83,optimize=True)
                video_name='mb-'+('male' if store=='mb-dryfit' else 'female')+'-exercise-loop.mp4'
                video_dest=Path('stores')/store/'brand-assets'/video_name
                subprocess.run(['ffmpeg','-y','-loglevel','error','-framerate','4','-i',str(Path(tmp)/'frame%02d.png'),
                   '-vf','minterpolate=fps=20:mi_mode=blend,scale=600:-2:flags=bicubic,format=yuv420p',
                   '-an','-c:v','libx264','-preset','veryfast','-crf','27','-movflags','+faststart',str(video_dest)],
                   check=True)
                assert 10000<video_dest.stat().st_size<1000000
            photo='/brand-assets/'+poster_name
            video='/brand-assets/'+video_name

            # Extend the existing build's brand-media bundler to include animated WebP.
            builder=Path('stores')/store/'scripts/build.mjs'
            builder_code=builder.read_text()
            assert 'jpg|mp4|svg' in builder_code and "file.endsWith('.svg')?'image/svg+xml':'image/jpeg'" in builder_code
            builder_code=builder_code.replace('jpg|mp4|svg','jpg|mp4|svg|webp').replace("file.endsWith('.svg')?'image/svg+xml':'image/jpeg'","file.endsWith('.svg')?'image/svg+xml':file.endsWith('.webp')?'image/webp':'image/jpeg'")
            builder.write_text(builder_code)
            path=Path('stores')/store/'worker/storefront.html'
            h=path.read_text()
            assert 'mb-landing-2026' in h and 'data-my-orders' in h and 'id="catalog"' in h and 'id="marcas"' in h
            start=h.index('<section class="mb-hero mb-landing-2026')
            end=h.index('</section>',start)+len('</section>')
            previous=h[start:end]
            import re
            category=re.search(r'<div class="hero-category-links">.*?</div>',previous,re.S)
            assert category, 'Filtros de categoria devem continuar'
            vid=('<video class="mb-visual-video" muted loop playsinline preload="metadata" poster="'+photo+'" aria-hidden="true"><source src="'+video+'" type="video/mp4"></video>') if video else ''
            cta='ENCONTRE SEU MODELO' if store=='mb-dryfit' else 'VER A COLEÇÃO'
            hero=('<section class="mb-hero mb-landing-2026 mb-landing-'+('dryfit' if store=='mb-dryfit' else 'her')+' mb-visual-2026" aria-label="Coleção MB">'
                  '<img class="mb-visual-photo hero-backdrop" src="'+photo+'" alt="" fetchpriority="high" decoding="async" aria-hidden="true">'+vid+
                  '<div class="mb-visual-shade" aria-hidden="true"></div>'
                  '<div class="mb-visual-copy mb-hero-copy"><span class="mb-visual-kicker hero-eyebrow">'+kicker+'</span><h1>'+title+'</h1><p>'+desc+'</p>'
                  '<div class="mb-visual-actions hero-actions"><a href="#colecao" class="solid-cta">'+cta+' <span aria-hidden="true">↗</span></a>'
                  '<a href="#marcas" class="hero-secondary">EXPLORAR MARCAS <span aria-hidden="true">→</span></a></div></div>'
                  '<div class="mb-visual-bottom">'+category.group()+'</div>'+
                  ('<div class="mb-editorial-photo mb-visual-hidden"><img src="/brand-assets/mb-gym-poster.jpg" alt="" aria-hidden="true"><div class="mb-editorial-orange"></div></div>' if store=='mb-dryfit' else '<div class="mb-her-editorial-scene mb-visual-hidden">FEITA PARA SE SENTIR INCRÍVEL.</div>')+
                  '</section>')
            # Five real brand shortcuts; preserve hidden legacy category hooks for existing tests.
            # Move the real existing brand tiles to the opening, rather than adding tiny text duplicates.
            brand_bar='<nav class="mb-visual-brands" id="heroBrands" aria-label="Filtrar por marca"></nav>'
            hero=hero.replace('<div class="mb-visual-bottom">'+category.group()+'</div>',
                              '<div class="mb-visual-bottom">'+brand_bar+'<div class="mb-original-categories-hidden" aria-hidden="true">'+category.group()+'</div></div>')
            assert hero.count('id="heroBrands"')==1
            h=h[:start]+hero+h[end:]
            css="""
          /* Photo-based MB visual design 2026. The live catalog and shopping logic are untouched. */
          @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');
          .announcement{display:none!important}
          .campaign-header{background:#fff!important;color:#15161a!important}
          .campaign-header .logo,.campaign-header .shop-tool{color:#15161a!important}
          .mb-hero.mb-visual-2026{--visual-accent:ACCENT;position:relative!important;isolation:isolate!important;display:flex!important;flex-direction:column!important;justify-content:space-between!important;gap:0!important;max-width:none!important;min-height:640px!important;padding:0!important;background:#0b0c10!important;color:#fff!important;overflow:hidden!important}
          .mb-hero.mb-visual-2026:before,.mb-hero.mb-visual-2026:after{content:none!important;display:none!important}
          .mb-visual-2026>.mb-visual-photo,.mb-visual-2026>.mb-visual-video{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:65% center!important;z-index:-3!important;pointer-events:none}
          .mb-visual-2026>.mb-visual-video{z-index:-2!important}
          .mb-visual-hidden{display:none!important}.mb-visual-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#07090df0 0%,#07090db8 42%,#07090d3b 100%),linear-gradient(0deg,#07090ddb,transparent 40%);pointer-events:none}
          .mb-visual-copy{position:relative;z-index:1;max-width:790px;padding:92px clamp(24px,6vw,100px) 85px;margin:auto 0!important}
          .mb-visual-kicker{display:block;color:#fff;font:700 11px/1.5 'DM Sans',Arial,sans-serif;letter-spacing:.17em}
          .mb-visual-kicker:before{content:'';display:inline-block;background:var(--visual-accent);height:3px;width:34px;margin-right:15px;vertical-align:middle}
          .mb-visual-2026 h1{font:800 clamp(53px,7.6vw,105px)/1.04 'DM Sans',Arial,sans-serif!important;letter-spacing:-.06em!important;margin:24px 0 22px!important;color:#fff!important}
          .mb-visual-2026 h1 em{color:var(--visual-accent)!important;font-style:normal!important}
          .mb-visual-copy>p{font:400 clamp(14px,1.4vw,19px)/1.6 'DM Sans',Arial,sans-serif!important;color:#f7f7f7!important;max-width:400px!important;margin:0 0 28px!important}
          .mb-visual-actions{display:flex;align-items:center;gap:17px 24px;flex-wrap:wrap}
          .mb-visual-actions .solid-cta{background:var(--visual-accent)!important;color:#fff!important;border-radius:5px!important;display:inline-flex;align-items:center;gap:21px;min-height:52px;padding:15px 23px!important;font:800 12px 'DM Sans',Arial,sans-serif!important;text-decoration:none}
          .mb-visual-actions .hero-secondary{color:#fff!important;font:700 12px 'DM Sans',Arial,sans-serif!important;text-decoration:none}
          .mb-visual-bottom{position:relative;z-index:2;min-height:76px;background:#0b0d10e8;border-top:1px solid #ffffff28;display:flex;align-items:center;justify-content:center;padding:15px 20px}
          .mb-visual-bottom .hero-category-links{display:flex;gap:12px 28px;align-items:center;justify-content:center}
          .mb-visual-bottom .hero-category-links button{font:700 11px 'DM Sans',Arial,sans-serif!important;color:#fff!important;min-height:41px;min-width:110px;border:1px solid #ffffff48!important;background:#ffffff0c!important;border-radius:5px!important;padding:11px 15px!important;cursor:pointer}
          .mb-visual-bottom .hero-category-links button:hover{border-color:var(--visual-accent)!important}
          .brand-selection.mb-brand-strip{background:#fff!important;padding-top:26px!important;padding-bottom:34px!important}
          .mb-brand-strip .brand-selection-heading h2{font:800 clamp(23px,3vw,35px) 'DM Sans',Arial,sans-serif!important;letter-spacing:-.045em;color:#17191d!important}
          .mb-brand-strip .brand-tile{background:#f5f5f6!important;border:1px solid #e6e6eb!important;color:#17191e!important;border-radius:11px!important}
          .mb-brand-strip .brand-tile[data-choose-brand="On"]{background:#f5f5f6!important}
          .mb-brand-strip .brand-tile[data-choose-brand="On"] .brand-symbol{display:none!important}
          .mb-brand-strip .brand-tile[data-choose-brand="On"]:before{content:'on';display:block;font:800 28px/1 'DM Sans',Arial,sans-serif;letter-spacing:-.17em;color:#16181e;margin-right:10px}
          @media(max-width:700px){
            .mb-hero.mb-visual-2026{min-height:570px!important}
            .mb-visual-2026>.mb-visual-photo,.mb-visual-2026>.mb-visual-video{object-position:65% center!important}
            .mb-visual-shade{background:linear-gradient(90deg,#07090ded,#07090da6 55%,#07090d42),linear-gradient(0deg,#07090dd7,transparent 50%)}
            .mb-visual-copy{padding:91px 21px 80px}
            .mb-visual-kicker{font-size:9px;letter-spacing:.13em}
            .mb-visual-kicker:before{width:22px;margin-right:8px}
            .mb-visual-2026 h1{font-size:clamp(40px,10.7vw,71px)!important;line-height:1.04!important;margin:22px 0 20px!important}
            .mb-visual-copy>p{font-size:13px!important;max-width:280px!important}
            .mb-visual-actions{gap:14px}
            .mb-visual-actions .solid-cta{min-height:48px;padding:12px 15px!important;font-size:10px!important;gap:9px}
            .mb-visual-actions .hero-secondary{font-size:10px!important}
            .mb-visual-bottom{min-height:75px;padding:12px 15px}
            .mb-visual-bottom .hero-category-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;gap:8px}
            .mb-visual-bottom .hero-category-links button{min-width:0;padding:9px 4px!important;font-size:9px!important}
          }
          @media(prefers-reduced-motion:reduce){.mb-visual-video{display:none!important}}
            """.replace('ACCENT',accent)
            # WebP intrinsically loops through exercise frames; do not pan the entire picture.
            css += """
          .mb-visual-2026>.mb-visual-photo{animation:none!important;object-position:54% center!important}
          .mb-visual-2026>.mb-visual-video{display:none!important}
          .mb-visual-2026>.mb-visual-shade{background:linear-gradient(90deg,#05070de0 0%,#05070da8 39%,#05070d19 100%),linear-gradient(0deg,#05070db3,transparent 50%)!important}
          @media(max-width:700px){.mb-visual-2026>.mb-visual-photo{object-position:60% center!important}}
            """
            # Keep original catalog DOM for existing tests, but remove obsolete oversized logo/about panel from display.
            css += """
          /* Last pass: hide old brand-logo panel in both storefronts. */
          .about-section,#sobre.about-section{display:none!important}
          /* Real dark moving background, not a screenshot of the proposed page. */
          .mb-hero.mb-visual-2026{width:100%!important;min-width:0!important;border-radius:0!important;box-sizing:border-box!important}
          .mb-visual-2026>.mb-visual-photo{z-index:0!important;filter:brightness(.68) contrast(1.12) saturate(.85)}
          .mb-visual-2026>.mb-visual-video{z-index:1!important;filter:brightness(.7) contrast(1.16) saturate(.85)}
          .mb-visual-2026>.mb-visual-shade{z-index:2!important;background:linear-gradient(90deg,#06070bea 0%,#06070bbd 48%,#06070b45 100%),linear-gradient(0deg,#06070be0 0%,transparent 50%)!important}
          .mb-visual-2026>.mb-visual-copy,.mb-visual-2026>.mb-visual-bottom{z-index:3!important}
          .mb-visual-2026>.mb-visual-copy{display:block!important;box-sizing:border-box!important;width:100%!important;max-width:850px!important;min-width:0!important;margin:auto 0!important;transform:none!important;left:auto!important;right:auto!important}
          .mb-visual-2026 h1{overflow-wrap:normal!important;word-break:normal!important;text-wrap:balance}
          .mb-visual-2026 .mb-visual-actions{justify-content:flex-start!important}
          .mb-visual-2026 .mb-visual-photo{animation:mbFilmPan 22s ease-in-out infinite alternate}
          @keyframes mbFilmPan{from{transform:scale(1.02) translateX(-1%)}to{transform:scale(1.11) translateX(1.5%)}}
          @media(max-width:700px){
            .mb-hero.mb-visual-2026{min-height:595px!important}
            .mb-visual-2026>.mb-visual-copy{padding:76px 22px 80px!important;max-width:100%!important}
            .mb-visual-2026 h1{font-size:clamp(33px,8.8vw,57px)!important;letter-spacing:-.055em!important;line-height:1.09!important;white-space:normal!important}
            .mb-visual-2026 .mb-visual-copy>p{max-width:295px!important}
            .mb-visual-2026>.mb-visual-photo{object-position:69% center!important}
            .mb-visual-2026>.mb-visual-video{object-position:65% center!important}
          }
          @media(prefers-reduced-motion:reduce){.mb-visual-2026 .mb-visual-photo{animation:none!important}}
          """
            css += """
          /* Five existing brands as prominent hero shortcuts; old garment shortcuts remain hidden. */
          .mb-original-categories-hidden{display:none!important}
          .mb-visual-bottom .mb-visual-brands{display:flex!important;flex-wrap:nowrap;align-items:center;justify-content:center;gap:10px;width:100%;max-width:720px}
          .mb-visual-bottom .mb-visual-brands button{color:#fff!important;background:#ffffff12!important;border:1px solid #ffffff47!important;border-radius:5px!important;min-height:43px;min-width:0;flex:1 1 0;padding:11px 8px!important;font:700 11px 'DM Sans',Arial,sans-serif!important;white-space:nowrap}
          .mb-visual-bottom .mb-visual-brands button span{color:var(--visual-accent)}
          .mb-visual-bottom .mb-visual-brands button:hover,.mb-visual-bottom .mb-visual-brands button:focus-visible{border-color:var(--visual-accent)!important;background:#ffffff24!important}
          @media(max-width:700px){.mb-visual-bottom{padding:11px 10px!important}.mb-visual-bottom .mb-visual-brands{gap:5px}.mb-visual-bottom .mb-visual-brands button{font-size:9px!important;padding:10px 2px!important}.mb-visual-bottom .mb-visual-brands button span{display:none}}
          """
            # Prevent a second brand strip, use existing logo tiles in readable, touch-friendly cards.
            css += """
          .mb-brand-strip[hidden]{display:none!important}
          .mb-visual-bottom{box-sizing:border-box!important;padding:12px 14px!important}
          #heroBrands{display:block!important;width:100%;max-width:900px;min-width:0!important;margin:auto}
          #heroBrands .brand-tile-list{display:flex!important;overflow-x:auto!important;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scrollbar-width:none;gap:10px!important;width:100%!important;padding:3px 0 6px!important}
          #heroBrands .brand-tile-list::-webkit-scrollbar{display:none}
          #heroBrands .brand-tile{flex:0 0 132px!important;min-width:132px!important;min-height:65px!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:9px!important;padding:11px 12px!important;border:1px solid #eeeeee!important;border-radius:10px!important;background:#f7f7f8!important;color:#171923!important;scroll-snap-align:start;font:700 12px 'DM Sans',Arial,sans-serif!important}
          #heroBrands .brand-tile .brand-symbol{display:inline-block!important;flex:0 0 31px!important;width:31px!important;height:26px!important;max-width:31px!important;background-size:contain!important;filter:none!important}
          #heroBrands .brand-tile[data-choose-brand="On"] .brand-symbol{display:none!important}
          #heroBrands .brand-tile[data-choose-brand="On"]:before{content:'on';font:800 27px/1 'DM Sans',Arial,sans-serif;letter-spacing:-.16em;color:#111}
          #heroBrands .brand-tile[data-choose-brand="On"]{background:#f7f7f8!important}
          #heroBrands .brand-tile:hover,#heroBrands .brand-tile.is-selected{border-color:var(--visual-accent)!important}
          .mb-visual-2026>.mb-visual-photo{animation:none!important;transform:none!important;filter:none!important}
          .mb-visual-2026>.mb-visual-video{animation:none!important;transform:none!important;filter:none!important;opacity:1!important}
          @media(max-width:700px){#heroBrands .brand-tile{flex-basis:117px!important;min-width:117px!important;min-height:63px!important;gap:7px!important;font-size:11px!important}#heroBrands .brand-tile .brand-symbol{flex-basis:27px!important;width:27px!important;height:25px!important}}
          """
            if store=='mb-dryfit':
              css += """
          .mb-visual-2026>.mb-visual-video{filter:brightness(1.32) contrast(1.05) saturate(.9)!important;opacity:1!important}
          .mb-visual-2026>.mb-visual-photo{filter:brightness(.92) contrast(1.12)!important}
          .mb-visual-2026>.mb-visual-shade{background:linear-gradient(90deg,#06070be9 0%,#06070bb8 43%,#06070b25 100%),linear-gradient(0deg,#06070bab,transparent 58%)!important}
              """
            if store=='mb-for-her':
              css += """
          .mb-visual-2026 h1{font-family:Georgia,'Times New Roman',serif!important;font-weight:700!important;letter-spacing:-.05em!important}
          .mb-visual-2026 h1 em{font-style:italic!important}
          .mb-visual-2026>.mb-visual-photo{object-position:58% 35%!important}
          .mb-visual-2026>.mb-visual-photo{filter:brightness(1.12) contrast(1.1) saturate(.9)!important;animation:mbFemaleWorkoutMotion 5.2s ease-in-out infinite alternate!important}
          @keyframes mbFemaleWorkoutMotion{0%{transform:translateY(1.5%) scale(1.05)}50%{transform:translateY(-1.5%) scale(1.09)}100%{transform:translateY(1.5%) scale(1.05)}}
          @media(prefers-reduced-motion:reduce){.mb-visual-2026>.mb-visual-photo{animation:none!important}}
          .mb-visual-2026>.mb-visual-shade{background:linear-gradient(90deg,#110c15eb 0%,#110c15c3 53%,#110c154d 100%),linear-gradient(0deg,#100b14d9,transparent 50%)!important}
          @media(max-width:700px){.mb-visual-2026 h1{font-size:clamp(33px,8.7vw,55px)!important}}
              """
            h=h.replace('</style></head>',css+'</style></head>')
            # Use the same mobile-friendly silent video player on both storefronts.
            if True:
              h=h.replace('</body></html>',"""<script>
          (() => {
            const v=document.querySelector('.mb-visual-video');
            if(!v || window.matchMedia('(prefers-reduced-motion: reduce)').matches || navigator.connection?.saveData)return;
            v.muted=true;v.loop=true;v.playsInline=true;
            const play=()=>v.play().catch(()=>{});
            if(document.visibilityState==='visible')play();
            document.addEventListener('visibilitychange',()=>{if(document.hidden)v.pause();else play()});
          })();
          </script></body></html>""")
            # One brand list in the actual DOM: relocate the five existing logo tiles without cloning.
            h=h.replace('</body></html>',"""<script>
          (() => {
            const destination=document.getElementById('heroBrands');
            const original=document.querySelector('.mb-brand-strip .brand-tile-list');
            if(destination && original) {
              destination.appendChild(original);
              const strip=document.querySelector('.mb-brand-strip');
              if(strip)strip.hidden=true;
              const explore=document.querySelector('.mb-visual-actions .hero-secondary');
              if(explore)explore.addEventListener('click',(event)=>{
                event.preventDefault();destination.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});
              });
            }
          })();
          </script></body></html>""")
            # Let the HTML video play only when visible; use static poster for low-power devices.
            h=h.replace('class="mb-visual-video" muted loop','class="mb-visual-video" muted loop')
            path.write_text(h)
            print('Updated photographic landing; preserved catalog:',store)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Preparar Workers existentes sem fotos nem migrações novas
        run: node scripts/cloudflare-prepare.mjs cloudflare.domains.config.json
      - name: Dry-run de ambas as lojas (sem deploy)
        run: |
          npx --no-install wrangler deploy --dry-run --config cloudflare-dist/dryfit/wrangler.json
          npx --no-install wrangler deploy --dry-run --config cloudflare-dist/her/wrangler.json
      - name: Conferir tabelas já existentes na MB Dryfit (somente leitura)
        run: npx --no-install wrangler d1 execute DB --remote --config cloudflare-dist/dryfit/wrangler.json --command "SELECT archived_at FROM products LIMIT 0; SELECT guard_count FROM model_change_events LIMIT 0; SELECT token_hash FROM staff_access_sessions LIMIT 0; SELECT viewer_id FROM shop_order_access LIMIT 0;"
      - name: Conferir tabelas já existentes na MB For Her (somente leitura)
        run: npx --no-install wrangler d1 execute DB --remote --config cloudflare-dist/her/wrangler.json --command "SELECT archived_at FROM products LIMIT 0; SELECT guard_count FROM model_change_events LIMIT 0; SELECT token_hash FROM staff_access_sessions LIMIT 0; SELECT viewer_id FROM shop_order_access LIMIT 0;"
      - name: Publicar Worker MB Dryfit sem migrar dados
        run: npx --no-install wrangler deploy --config cloudflare-dist/dryfit/wrangler.json --keep-vars
      - name: Publicar Worker MB For Her sem migrar dados
        run: npx --no-install wrangler deploy --config cloudflare-dist/her/wrangler.json --keep-vars
      - name: Testar páginas públicas das duas lojas
        run: |
          for page in https://mbdryfit.com.br/acesso https://mbdryfit.com.br/catalogo https://forher.mbdryfit.com.br/catalogo; do
            echo "Conferindo $page"
            curl --fail --location --silent --show-error --max-time 25 --user-agent "Mozilla/5.0 (compatible; MB-release-check/1.0)" --output /dev/null "$page"
          done
          echo "Publicação das duas lojas concluída, páginas responderam com HTTP 2xx/3xx."
