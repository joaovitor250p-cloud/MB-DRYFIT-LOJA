      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:hosting
      - name: Preparar apenas o código, sem ativar R2 nem aplicar a migração 0042
        env:
          MB_RELEASE_CODE_ONLY: '1'
        run: node scripts/cloudflare-prepare.mjs cloudflare.domains.config.json
      - name: Confirmar que os dois Workers estão sem fotos e sem a migração 0042
        run: |
          node --input-type=module <<'NODE'
          import {readFile,readdir} from 'node:fs/promises';
          for(const key of ['dryfit','her']){
            const dir='cloudflare-dist/'+key;
            const config=JSON.parse(await readFile(dir+'/wrangler.json','utf8'));
            if(config.vars.MB_PHOTOS_ENABLED!=='0'||config.r2_buckets)
              throw Error('Fotos R2 não podem ser ativadas nesta publicação: '+key);
            const names=await readdir(dir+'/migrations');
            if(names.some(n=>Number(n.slice(0,4))>34))
              throw Error('Migração posterior a 0034 está incluída: '+key);
            console.log('Pré-verificação concluída para '+key+' ('+names.length+' migrações locais não aplicadas).');
          }
          NODE
  publicar:
    name: Publicar Workers da Cloudflare
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare-producao
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MB_RELEASE_CODE_ONLY: '1'
    steps:
      - name: Confirmar credencial disponibilizada pelo proprietário
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta a credencial CLOUDFLARE_API_TOKEN no environment cloudflare-producao ou nos Secrets do repositório. Cadastre-a pelo GitHub; NÃO envie a chave por chat."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: cff723e5b8384fccb3d134d8a9da30bdfb62b61f
          persist-credentials: false
      - name: Buscar apenas os catálogos atualizados
        uses: actions/checkout@v4
        with:
          ref: main
          path: catalogos-atuais
          persist-credentials: false
      - name: Instalar codificador de frames para vídeos leves
        run: python3 -m pip install --quiet Pillow imageio-ffmpeg
      - name: Aplicar campanha fotográfica mantendo catálogo e vendas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for store,accent,title,kicker,desc,photo,video in [
            ('mb-dryfit','#ff7623','SEU RITMO.<br><em>SUAS REGRAS.</em>','PERFORMANCE PARA O SEU DIA.','Do treino para a vida. Encontre a peça que acompanha você.','/brand-assets/mb-male-exercise.webp',None),
            ('mb-for-her','#ef2984','SEU MOVIMENTO.<br><em>SEU ESTILO.</em>','MB FOR HER / THE MOVEMENT EDIT','Uma coleção feita para acompanhar sua energia, seu ritmo e todos os seus momentos.','/brand-assets/mb-female-exercise.webp',None)
          ]:
            # Ship original silent workout animations as local Worker assets, no external CDN.
            animation_file='mb-male-exercise.webp' if store=='mb-dryfit' else 'mb-female-exercise.webp'
            source_animation=Path('catalogos-atuais/stores')/store/'brand-assets'/animation_file
            dest_animation=Path('stores')/store/'brand-assets'/animation_file
            asset_data=source_animation.read_bytes()
            assert asset_data[:4]==b'RIFF' and len(asset_data)>5000, 'Animated WebP asset missing'
            dest_animation.write_bytes(asset_data)
            # Convert the 4-frame animated WebP into a small hardware-decoded H.264 loop.
            # Create 6 ping-pong frames; frame blending avoids the visible 4-frame stutter.
            from PIL import Image
            from pathlib import Path
            import tempfile,subprocess,imageio_ffmpeg
            with Image.open(source_animation) as img:
              n=getattr(img,'n_frames',1)
              assert n>=3 and n<=24
              with tempfile.TemporaryDirectory() as tmp:
                indexes=list(range(n))+list(range(n-2,0,-1))
                for j,k in enumerate(indexes):
                  img.seek(k)
                  rgb=img.convert('RGB')
                  rgb.save(Path(tmp)/('frame%02d.png'%j))
                  if j==0:
                    poster_name='mb-'+('male' if store=='mb-dryfit' else 'female')+'-exercise-poster.jpg'
                    rgb.save(Path('stores')/store/'brand-assets'/poster_name,quality=83,optimize=True)
