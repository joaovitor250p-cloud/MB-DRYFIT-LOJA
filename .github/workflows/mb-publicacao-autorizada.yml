                const remove=document.createElement('button');remove.type='button';remove.className='secondary';remove.textContent='Remover';
                const status=document.createElement('small');status.setAttribute('role','status');
                button.addEventListener('click',async()=>{
                  const selected=file.files?.[0];if(!selected){status.textContent='Escolha um arquivo.';return}
                  if(selected.size>(selected.type.startsWith('video/')?5:8)*1048576){status.textContent='Arquivo acima do limite.';return}
                  button.disabled=true;status.textContent='Otimizando…';
                  try{
                    let upload=selected;
                    if(/^image\\/(jpeg|png|webp)$/.test(selected.type)){
                      const bitmap=await createImageBitmap(selected);
                      try{
                        const scale=Math.min(1,1400/Math.max(bitmap.width,bitmap.height));
                        const canvas=document.createElement('canvas');
                        canvas.width=Math.max(1,Math.round(bitmap.width*scale));
                        canvas.height=Math.max(1,Math.round(bitmap.height*scale));
                        canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);
                        const webp=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',0.76));
                        if(!webp||webp.type!=='image/webp')throw Error('Não foi possível converter a imagem.');
                        upload=webp;
                      }finally{bitmap.close?.()}
