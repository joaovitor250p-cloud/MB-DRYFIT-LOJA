            npx --no-install wrangler d1 execute DB --remote --config "cloudflare-dist/$loja/wrangler.json" --command "SELECT COUNT(*) AS conflitos_entre_pecas FROM products p JOIN product_barcodes b ON b.barcode=p.barcode AND b.product_id!=p.id;"
          done
