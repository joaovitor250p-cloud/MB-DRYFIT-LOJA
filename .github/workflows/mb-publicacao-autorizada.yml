      - name: Publicar Worker MB For Her sem migrar dados
        run: npx --no-install wrangler deploy --config cloudflare-dist/her/wrangler.json --keep-vars
      - name: Testar páginas públicas das duas lojas
        run: |
          for page in https://mbdryfit.com.br/acesso https://mbdryfit.com.br/catalogo https://forher.mbdryfit.com.br/catalogo; do
            echo "Conferindo $page"
            curl --fail --location --silent --show-error --max-time 25 --user-agent "Mozilla/5.0 (compatible; MB-release-check/1.0)" --output /dev/null "$page"
          done
          # Owner uploads must never be publicly writable.
          for host in https://mbdryfit.com.br https://forher.mbdryfit.com.br; do
            status="$(curl --silent --show-error --max-time 25 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: image/png' --data-binary 'teste-sem-login' "$host/api/catalog-media")"
            if [ "$status" != 401 ] && [ "$status" != 403 ]; then
              echo "::error::Rota de mídia pública sem autenticação ($status): $host"
              exit 1
            fi
            echo "Upload não autorizado bloqueado em $host (HTTP $status)"
          done
          echo "Publicação das duas lojas concluída, páginas responderam com HTTP 2xx/3xx."
