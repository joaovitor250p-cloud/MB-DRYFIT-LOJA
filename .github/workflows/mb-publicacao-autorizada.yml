      - name: Verificar sintaxe real do painel antes de publicar
        shell: bash
        run: |
          python3 - <<'PY'
          import re,subprocess,tempfile,pathlib
          for store in ('mb-dryfit','mb-for-her'):
              page=(pathlib.Path('stores')/store/'worker/page.html').read_text()
              for i,script in enumerate(re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',page,re.S)):
                  if not script.strip():continue
                  with tempfile.TemporaryDirectory() as tmp:
                      file=pathlib.Path(tmp)/('painel-'+store+'-'+str(i)+'.js')
                      file.write_text(script)
                      p=subprocess.run(['node','--check',str(file)],text=True,capture_output=True)
                      if p.returncode:
                          print('ERRO DE SINTAXE NO PAINEL',store,'script',i)
                          print(p.stderr)
                          lines=script.splitlines()
                          m=re.search(r':(\\d+)\\n',p.stderr)
                          if m:
                              at=int(m.group(1))
                              for n in range(max(1,at-6),min(len(lines),at+6)+1):
                                  print(str(n)+': '+lines[n-1][:300])
                          raise SystemExit(1)
              print('JS da gestão verificado:',store)
          PY
      - name: Aplicar correção de acesso móvel da main nos dois Workers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for store in ('mb-dryfit','mb-for-her'):
              target=Path('stores')/store/'worker/page.html'
              source=Path('catalogos-atuais/stores')/store/'worker/page.html'
              old=target.read_text(encoding='utf-8')
              new=source.read_text(encoding='utf-8')
              def between(text, start, end):
                  assert text.count(start)==1 and text.count(end)>=1, (store,start)
                  return start+text.split(start,1)[1].split(end,1)[0]
              before=between(old,"async function api(path,method='GET',data)","\nfunction toast(")
              after=between(new,"async function api(path,method='GET',data)","\nfunction toast(")
              assert 'AbortController' in after and 'finally{clearTimeout(timeout)}' in after
              assert before in old
              old=old.replace(before,after,1)
              marker='<script src="/vendor/qz-tray.js"></script><script src="/vendor/zxing-browser.min.js"></script>'
              defer='<script defer src="/vendor/qz-tray.js"></script><script defer src="/vendor/zxing-browser.min.js"></script>'
              assert old.count(marker)==1 and new.count(defer)==1
              old=old.replace(marker,defer,1)
              watchdog_start='<script>\n(function(){\n  var startupError'
              watchdog=between(new,watchdog_start,'</script>')+'</script>'
              assert watchdog.count("setTimeout(function(){")==1
              assert old.count('</style></head>')==1 and watchdog_start not in old
              old=old.replace('</style></head>','</style>'+watchdog+'</head>',1)
              assert 'AbortController' in old and watchdog in old and defer in old
              target.write_text(old,encoding='utf-8')
              print('Startup da gestão protegido para',store)
          PY
