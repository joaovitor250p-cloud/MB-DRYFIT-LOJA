name: Publicar MB Dryfit e For Her (autorizado, sem fotos)
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mb-publicacao-autorizada.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publicar-cloudflare-mb
  cancel-in-progress: false
jobs:
  preparar:
    name: Validar build parcial seguro
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1462078ac7e7bbf050a9c17094799e4a60a6aa1a
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:hosting
      - name: Preparar apenas o código, sem ativar R2 nem aplicar a migração 0042
        env:
          MB_RELEASE_CODE_ONLY: '1'
        run: node scripts/cloudflare-prepare.mjs cloudflare.domains.config.json
      - name: Confirmar que os dois Workers estão sem fotos e sem a migração 0042
        run: |
          node --input-type=module <<'NODE'
          import {readFile,readdir} from 'node:fs/promises';
          for(const key of ['dryfit','her']){
            const dir='cloudflare-dist/'+key;
            const config=JSON.parse(await readFile(dir+'/wrangler.json','utf8'));
            if(config.vars.MB_PHOTOS_ENABLED!=='0'||config.r2_buckets)
              throw Error('Fotos R2 não podem ser ativadas nesta publicação: '+key);
            const names=await readdir(dir+'/migrations');
            if(names.some(n=>Number(n.slice(0,4))>34))
              throw Error('Migração posterior a 0034 está incluída: '+key);
            console.log('Pré-verificação concluída para '+key+' ('+names.length+' migrações locais não aplicadas).');
          }
          NODE
  publicar:
    name: Publicar Workers da Cloudflare
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare-producao
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MB_RELEASE_CODE_ONLY: '1'
    steps:
      - name: Confirmar credencial disponibilizada pelo proprietário
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta a credencial CLOUDFLARE_API_TOKEN no environment cloudflare-producao ou nos Secrets do repositório. Cadastre-a pelo GitHub; NÃO envie a chave por chat."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: 1462078ac7e7bbf050a9c17094799e4a60a6aa1a
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Preparar Workers existentes sem fotos nem migrações novas
        run: node scripts/cloudflare-prepare.mjs cloudflare.domains.config.json
      - name: Dry-run de ambas as lojas (sem deploy)
        run: |
          npx --no-install wrangler deploy --dry-run --config cloudflare-dist/dryfit/wrangler.json
          npx --no-install wrangler deploy --dry-run --config cloudflare-dist/her/wrangler.json
      - name: Conferir tabelas já existentes na MB Dryfit (somente leitura)
        run: npx --no-install wrangler d1 execute DB --remote --config cloudflare-dist/dryfit/wrangler.json --command "SELECT archived_at FROM products LIMIT 0; SELECT guard_count FROM model_change_events LIMIT 0; SELECT token_hash FROM staff_access_sessions LIMIT 0; SELECT viewer_id FROM shop_order_access LIMIT 0;"
      - name: Conferir tabelas já existentes na MB For Her (somente leitura)
        run: npx --no-install wrangler d1 execute DB --remote --config cloudflare-dist/her/wrangler.json --command "SELECT archived_at FROM products LIMIT 0; SELECT guard_count FROM model_change_events LIMIT 0; SELECT token_hash FROM staff_access_sessions LIMIT 0; SELECT viewer_id FROM shop_order_access LIMIT 0;"
      - name: Publicar Worker MB Dryfit sem migrar dados
        run: npx --no-install wrangler deploy --config cloudflare-dist/dryfit/wrangler.json --keep-vars
      - name: Publicar Worker MB For Her sem migrar dados
        run: npx --no-install wrangler deploy --config cloudflare-dist/her/wrangler.json --keep-vars
      - name: Testar páginas públicas das duas lojas
        run: |
          for page in https://mbdryfit.com.br/acesso https://mbdryfit.com.br/catalogo https://forher.mbdryfit.com.br/catalogo; do
            echo "Conferindo $page"
            curl --fail --location --silent --show-error --max-time 25 --user-agent "Mozilla/5.0 (compatible; MB-release-check/1.0)" --output /dev/null "$page"
          done
          echo "Publicação das duas lojas concluída, páginas responderam com HTTP 2xx/3xx."
