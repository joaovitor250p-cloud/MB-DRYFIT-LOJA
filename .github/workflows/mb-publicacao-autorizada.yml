                   '-vf','minterpolate=fps=20:mi_mode=blend,scale=600:-2:flags=bicubic,format=yuv420p',
                   '-an','-c:v','libx264','-preset','veryfast','-crf','27','-movflags','+faststart',str(video_dest)],
                   check=True)
                assert 10000<video_dest.stat().st_size<1000000
            photo='/brand-assets/'+poster_name
            video='/brand-assets/'+video_name

            # Extend the existing build's brand-media bundler to include animated WebP.
            builder=Path('stores')/store/'scripts/build.mjs'
            builder_code=builder.read_text()
            assert 'jpg|mp4|svg' in builder_code and "file.endsWith('.svg')?'image/svg+xml':'image/jpeg'" in builder_code
