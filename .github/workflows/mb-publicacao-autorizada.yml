                const url=form.querySelector('[name="banner_slide_'+n+'_url"]');if(!url)continue;
                const holder=url.closest('label')||url.parentNode;
                const zone=document.createElement('div');zone.className='mbw-owner-upload';
                zone.style.cssText='display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:9px 0 18px';
                const file=document.createElement('input');file.type='file';file.accept='image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm';
