name: Preparar biblioteca gratuita de imagens (sem R2)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'media-public/**'
      - 'scripts/build-free-media.py'
      - '.github/workflows/mb-midias-gratis-pages.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Otimizar imagens para a biblioteca pública
        run: python scripts/build-free-media.py
      - name: Salvar resultado para inspeção (sem publicação automática)
        uses: actions/upload-artifact@v4
        with:
          name: mb-midias-gratis-otimizadas
          path: dist-free-media/
          retention-days: 7
# A publicação Cloudflare Pages só será ligada após o projeto Pages
# existir e uma credencial com Workers Pages Edit estar configurada.
# Isso evita tentar criar serviços ou alterar contas automaticamente.
