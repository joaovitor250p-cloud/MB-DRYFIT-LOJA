name: Verificar sistema MB
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:hosting
      - run: node --test ops/backup/mb-backup.test.mjs
      - run: node --test ops/backup/export-cloudflare.test.mjs
      - run: node --test ops/backup/check-restore.test.mjs
      - run: node --test ops/security/repository-guard.test.mjs
