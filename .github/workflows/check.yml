name: Verificar sistema MB
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python3 -m py_compile scripts/online-order-alerts-update.py scripts/fix-media-studio.py
      - uses: actions/checkout@v4
        with:
          ref: cff723e5b8384fccb3d134d8a9da30bdfb62b61f
          path: release-smoke
          persist-credentials: false
      - name: Testar montagem dos avisos sem publicar
        run: |
          cp scripts/online-order-alerts-update.py release-smoke/scripts/
          cd release-smoke
          python3 scripts/online-order-alerts-update.py
          for store in mb-dryfit mb-for-her; do
            node --check "stores/$store/worker/owner-commerce.js"
            node --check "stores/$store/worker/shop-commerce.js"
            grep -q "pending_count" "stores/$store/worker/shop-commerce.js"
            grep -q 'mbUpdateOrderBadge' "stores/$store/worker/owner-commerce.js"
          done
      - name: Conferir limpeza de ambos os catálogos sem alterar lojas reais
        run: |
          python3 -m py_compile scripts/limpar-catalogos-publicos.py
          python3 scripts/testar-limpeza-catalogos.py
      - name: Testar os filtros nas duas lojas sem publicar
        run: |
          python3 -m py_compile scripts/aplicar-filtros-marca-peca.py
          python3 scripts/testar-filtros-marca-peca.py
      - name: Testar carrinho imediato e painel do dono nos dois sites
        run: |
          python3 -m py_compile scripts/carrinho-tela-imediata.py scripts/organizar-modelos-export-mobile.py scripts/separar-pedidos-cupons-notificacao.py
          cp scripts/carrinho-tela-imediata.py scripts/organizar-modelos-export-mobile.py scripts/separar-pedidos-cupons-notificacao.py release-smoke/scripts/
          cd release-smoke
          python3 scripts/separar-pedidos-cupons-notificacao.py
          python3 scripts/carrinho-tela-imediata.py
          python3 scripts/organizar-modelos-export-mobile.py
          python3 - <<'PY'
          import re,subprocess,pathlib,tempfile
          for store in ('mb-dryfit','mb-for-her'):
              root=pathlib.Path('stores')/store/'worker'
              cart=(root/'storefront-cart.js').read_text()
              html=(root/'storefront.html').read_text()
              admin=(root/'page.html').read_text()
              assert 'window.scrollTo?.({top:0' not in cart[cart.index('function openShopCart()'):cart.index('function renderShopCart()')]
              assert "document.body.classList.add('mb-cart-open')" in cart
              assert "role','dialog" in cart
              assert '#shopCartDialog.shop-cart-workspace' in html
              assert 'mbOpenModelExport' in admin and 'makeZip(files)' in admin
              assert 'mbAutomaticBarcode' in admin
              assert 'Excluir modelo' in admin
              assert "['orders','≡','Pedidos online']" in admin
              assert "['commerce','%','Cupons']" in admin
              assert "if(page==='orders'&&staff()){renderOnlineOrders();return}" in admin
              owner_commerce=(root/'owner-commerce.js').read_text()
              assert 'mbMountOrderSoundPanel' in owner_commerce
              assert "document.querySelector('#nav [data-page=\"orders\"]')" in owner_commerce
              assert "api('retail/orders?state=received&offset=0')" in owner_commerce
              assert 'view.prepend(alertPanel);' not in owner_commerce
              assert 'mb-commerce-hidden' in owner_commerce
              assert '#nav [data-page="orders"] .mb-order-count' in admin
              assert 'mbMountOrderSoundPanel(view)' in (root/'staff-workspace.js').read_text()
              assert 'Ver vitrine ↗' not in admin
              assert 'Importação Nex</button>' not in admin
              assert 'showArchivedModels()' not in admin
              with tempfile.TemporaryDirectory() as tmp:
                  subprocess.run(['node','--check',str(root/'storefront-cart.js')],check=True)
                  subprocess.run(['node','--check',str(root/'owner-commerce.js')],check=True)
                  subprocess.run(['node','--check',str(root/'staff-workspace.js')],check=True)
                  for page in (html,admin):
                      for i,inline in enumerate(re.findall(r'<script>(.*?)</script>',page,flags=re.S)):
                          if not inline.strip():continue
                          src=pathlib.Path(tmp)/f'script-{i}.js'
                          src.write_text(inline)
                          subprocess.run(['node','--check',str(src)],check=True)
              print('PASS: responsive cart and model management',store)
          PY
      - name: Testar leitura por toque, flash e rascunho local nas duas lojas
        run: |
          python3 -m py_compile scripts/atualizar-camera-pdv-local.py
          node --check scripts/testar-camera-pdv-local.mjs
          cp scripts/atualizar-camera-pdv-local.py scripts/testar-camera-pdv-local.mjs release-smoke/scripts/
          cd release-smoke
          python3 scripts/atualizar-camera-pdv-local.py
          node scripts/testar-camera-pdv-local.mjs
      - name: Testar estoque, REF, WhatsApp, pedidos, reposição e impressora nas duas lojas
        run: |
          python3 -m py_compile scripts/ajustes-ref-estoque-tamanhos.py scripts/ajustes-pedido-whatsapp-impressao.py scripts/corrigir-opcoes-filtros.py
          cp scripts/aplicar-filtros-marca-peca.py scripts/ajustes-ref-estoque-tamanhos.py scripts/ajustes-pedido-whatsapp-impressao.py scripts/corrigir-opcoes-filtros.py release-smoke/scripts/
          cd release-smoke
          python3 scripts/aplicar-filtros-marca-peca.py
          python3 scripts/ajustes-ref-estoque-tamanhos.py
          python3 scripts/ajustes-pedido-whatsapp-impressao.py
          python3 scripts/corrigir-opcoes-filtros.py
          for store in mb-dryfit mb-for-her; do
            node --check "stores/$store/worker/staff-workspace.js"
            node --check "stores/$store/worker/storefront-cart.js"
            node --check "stores/$store/worker/storefront-contacts.js"
            node --check "stores/$store/worker/shop-commerce.js"
            node --check "stores/$store/worker/model-management.js"
            node --check "stores/$store/worker/api.js"
            node --check "stores/$store/worker/native-print.js"
            node --check "stores/$store/worker/appearance.js"
            grep -q 'catalog_hidden_brands' "stores/$store/worker/appearance.js"
            grep -q 'mbColorExhausted' "stores/$store/worker/storefront.html"
            grep -q 'mbOwnerFilterLines' "stores/$store/worker/page.html"
          done
      - name: Testar suite completa sobre a versão congelada com alterações aplicadas
        run: |
          cp scripts/atualizar-fixtures-ref.py release-smoke/scripts/
          cd release-smoke
          python3 scripts/atualizar-fixtures-ref.py
          npm ci
          npm run check
      - name: Testar os atalhos de performance sobre a versão congelada
        run: |
          cp scripts/otimizar-performance-fluxos.py release-smoke/scripts/
          cd release-smoke
          python3 scripts/otimizar-performance-fluxos.py
          node --check stores/mb-dryfit/worker/storefront-cart.js
          node --check stores/mb-dryfit/worker/staff-workspace.js
          (cd stores/mb-dryfit && node --test tests/storefront-cart.test.mjs)
          npm run check
      - name: Testar integração de promoções e pedidos das duas lojas
        run: |
          cp scripts/mb-variant-promotions.js scripts/mb-order-adjustments.js scripts/mb-customer-checkout-ui.js scripts/mb-staff-commerce-ui.js scripts/mb-promotion-catalog-ui.js scripts/ativar-commerce-2026.py scripts/ajustar-cliente-2026.py scripts/instalar-interfaces-commerce-2026.py scripts/ajustar-fixtures-comercio-2026.py scripts/mb-commerce-2026.test.mjs release-smoke/scripts/
          cd release-smoke
          python3 scripts/ativar-commerce-2026.py
          python3 scripts/ajustar-cliente-2026.py
          python3 scripts/instalar-interfaces-commerce-2026.py
          python3 scripts/ajustar-fixtures-comercio-2026.py
          for store in mb-dryfit mb-for-her; do
            cp scripts/mb-commerce-2026.test.mjs "stores/$store/tests/mb-commerce-2026.test.mjs"
            node --check "stores/$store/worker/mb-variant-promotions.js"
            node --check "stores/$store/worker/mb-order-adjustments.js"
            node --check "stores/$store/worker/staff-workspace.js"
            node --check "stores/$store/worker/storefront-cart.js"
            node --check "stores/$store/worker/storefront-orders.js"
            node --check "stores/$store/worker/catalog-cart.js"
            node --check "stores/$store/worker/shop-commerce.js"
            node --check "stores/$store/worker/api.js"
          done
          npm run check
      - run: npm ci
      - run: npm run check
