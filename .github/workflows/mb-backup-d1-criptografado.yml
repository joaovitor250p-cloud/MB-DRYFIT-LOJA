name: Exportação criptografada D1 - MB
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Digite EXPORTAR para autorizar somente a cópia dos bancos D1"
        required: true
        type: string
      motivo:
        description: "Motivo interno da exportação (sem informações pessoais)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/mb-backup-d1-criptografado.yml
permissions:
  contents: read
concurrency:
  group: mb-backup-d1-seguro
  cancel-in-progress: false

jobs:
  teste_sem_dados_reais:
    name: Simular criptografia e restauração sem dados reais
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Exercitar fluxo offline com informações fictícias
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          export MB_BACKUP_PASSPHRASE='chave-ficticia-apenas-para-testes-locais-2026'
          printf '%s\n' 'CREATE TABLE teste(id INTEGER PRIMARY KEY, valor TEXT);' "INSERT INTO teste(valor) VALUES ('exemplo');" > "$temp/teste.sql"
          openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -salt -in "$temp/teste.sql" -out "$temp/teste.sql.enc" -pass env:MB_BACKUP_PASSPHRASE
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in "$temp/teste.sql.enc" -out "$temp/validar.sql" -pass env:MB_BACKUP_PASSPHRASE
          cmp "$temp/teste.sql" "$temp/validar.sql"
          TEMP_DIR="$temp" python3 - <<'PY'
          import os,sqlite3
          from pathlib import Path
          directory=Path(os.environ['TEMP_DIR'])
          db=sqlite3.connect(directory/'restaurado.sqlite')
          try:
            db.executescript((directory/'validar.sql').read_text())
            assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
            assert db.execute('SELECT valor FROM teste').fetchone()[0]=='exemplo'
            print('Teste offline de backup e restauração passou; nenhum banco real acessado.')
          finally:
            db.close()
          PY
  exportar:
    if: github.event_name == 'workflow_dispatch'
    name: Exportar D1 separado por loja (somente leitura)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-producao
    env:
      MB_EXPORT_CONFIRMATION: ${{ inputs.confirmar }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MB_BACKUP_PASSPHRASE: ${{ secrets.MB_BACKUP_PASSPHRASE }}
      MB_RELEASE_CODE_ONLY: '1'
    steps:
      - name: Verificar acesso e chave de criptografia
        shell: bash
        run: |
          test "$MB_EXPORT_CONFIRMATION" = "EXPORTAR" || { echo "::error::Confirmação EXPORTAR obrigatória"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Token da Cloudflare ausente"; exit 1; }
          test "${#MB_BACKUP_PASSPHRASE}" -ge 20 || { echo "::error::Configure MB_BACKUP_PASSPHRASE (20+ caracteres) nos segredos do environment cloudflare-producao"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: cff723e5b8384fccb3d134d8a9da30bdfb62b61f
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Montar configurações das duas bases sem migrações
        run: node scripts/cloudflare-prepare.mjs cloudflare.domains.config.json
      - name: Confirmar que o destino de cada loja é um D1 diferente
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('cloudflare.domains.config.json').read_text())
          database_ids=[cfg[key]['database_id'] for key in ('dryfit','her')]
          if len(set(database_ids))!=2 or any(not db for db in database_ids):
              raise SystemExit('Banco D1 duplicado ou inválido: exportação interrompida')
          for name in ('dryfit','her'):
              wc=json.loads(Path('cloudflare-dist',name,'wrangler.json').read_text())
              bindings=wc.get('d1_databases',[])
              if len(bindings)!=1 or bindings[0].get('binding')!='DB' or bindings[0].get('database_id')!=cfg[name]['database_id']:
                  raise SystemExit('Configuração D1 incorreta para '+name)
          print('Duas bases D1 independentes verificadas sem consultar dados de clientes.')
          PY
      - name: Exportar as duas bases de dados separadamente e criptografar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .backup-privado/cifrados
          umask 077
          trap 'rm -f .backup-privado/*.sql' EXIT
          for loja in dryfit her; do
            echo "Exportando D1 de $loja (sem imprimir dados)..."
            npx --no-install wrangler d1 export DB --remote --config "cloudflare-dist/$loja/wrangler.json" --output ".backup-privado/$loja.sql"
            test -s ".backup-privado/$loja.sql"
            openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -salt -in ".backup-privado/$loja.sql" -out ".backup-privado/cifrados/$loja.sql.enc" -pass env:MB_BACKUP_PASSPHRASE
            rm -f ".backup-privado/$loja.sql"
          done
          (cd .backup-privado/cifrados && sha256sum *.enc > SHA256SUMS.txt)
      - name: Validar descriptografia e integridade SQL em banco local isolado
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f .backup-privado/validar-*.sql .backup-privado/validar-*.sqlite' EXIT
          for loja in dryfit her; do
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in ".backup-privado/cifrados/$loja.sql.enc" -out ".backup-privado/validar-$loja.sql" -pass env:MB_BACKUP_PASSPHRASE
            test -s ".backup-privado/validar-$loja.sql"
            LOJA="$loja" python3 - <<'PY'
          import os,sqlite3
          from pathlib import Path
          loja=os.environ['LOJA']
          source=Path(f'.backup-privado/validar-{loja}.sql')
          database=Path(f'.backup-privado/validar-{loja}.sqlite')
          sql=source.read_text(encoding='utf-8')
          db=sqlite3.connect(database)
          try:
              db.executescript(sql)
              result=db.execute('PRAGMA integrity_check').fetchone()[0]
              if result!='ok': raise RuntimeError('Falha de integridade no backup '+loja)
              table_count=db.execute("SELECT count(*) FROM sqlite_master WHERE type='table'").fetchone()[0]
              if table_count==0: raise RuntimeError('Nenhuma tabela no backup '+loja)
              print(f'Restauração local e integridade aprovadas para {loja}.')
          finally:
              db.close()
          PY
            rm -f ".backup-privado/validar-$loja.sql" ".backup-privado/validar-$loja.sqlite"
          done
          (cd .backup-privado/cifrados && sha256sum --check SHA256SUMS.txt)

          printf 'Backup D1 criptografado de duas lojas. CUIDADO: nao inclui fotos R2, contas Firebase ou secrets. Validade operacional ainda depende de teste de restauracao do aplicativo em homologacao.\\n' > .backup-privado/cifrados/LEIA-ME.txt
      - name: Guardar apenas arquivos criptografados por 7 dias
        uses: actions/upload-artifact@v4
        with:
          name: mb-d1-criptografado-${{ github.run_number }}
          path: .backup-privado/cifrados/
          if-no-files-found: error
          retention-days: 7
