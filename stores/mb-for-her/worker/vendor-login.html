<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MB For Her | Login dos vendedores</title><style>:root{--accent:#ed087e}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:#11151a;color:#edf0f3;font:14px Arial,sans-serif}.box{width:min(420px,100%);padding:34px;border:1px solid #ffffff16;border-radius:18px;background:#1c232b}.brand{font-size:28px;font-weight:900;letter-spacing:-1px;margin-bottom:30px}.brand b{color:var(--accent)}label{display:grid;gap:9px;font-size:12px;margin:20px 0}input{width:100%;min-width:0;padding:14px;border:1px solid #44515e;border-radius:7px;background:#131a21;color:white;font:16px Arial,sans-serif}button{cursor:pointer}button[type=submit]{width:100%;padding:15px;border:0;border-radius:7px;background:var(--accent);color:#11151a;font-weight:700;font-size:14px}.forgot{display:block;margin:20px auto 0;border:0;padding:5px;background:none;color:#c3ccd6;font-size:12px;text-decoration:underline;text-underline-offset:4px}button:disabled{opacity:.5;cursor:wait}.status{font-size:12px;color:#f2bca0;line-height:1.8;margin:14px 0;overflow-wrap:anywhere}.status:empty{display:none}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}[hidden]{display:none!important}@media(max-width:480px){.box{padding:28px 23px}}/*__ENTRY_LAYOUT__*/
</style></head><body class="staff-login"><main class="box" aria-label="Login dos vendedores"><div class="brand">MB <b>FOR HER</b></div><form id="login"><label>E-mail<input id="email" value="__STAFF_LOGIN_EMAIL__" type="email" maxlength="254" autocomplete="username" required></label><label>Senha<input id="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required></label><button type="submit" id="enter">Entrar</button><button type="button" class="forgot" id="reset">Esqueci minha senha</button></form><p id="status" class="status" role="status" aria-live="polite"></p></main><script type="module">
const $=id=>document.getElementById(id);let client;
async function firebase(){if(!client)client=(async()=>{const response=await fetch('/api/account/firebase/config'),{config}=await response.json();if(!config)throw Error('O acesso está em configuração.');const [appSDK,sdk]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js')]);const app=appSDK.getApps().find(a=>a.name==='mb-dryfit')||appSDK.initializeApp(config,'mb-dryfit'),auth=sdk.getAuth(app);auth.languageCode='pt';return {auth,sdk}})();return client}
async function run(action){$('status').textContent='';document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await action()}catch(error){$('status').textContent=error.code==='auth/invalid-credential'?'E-mail ou senha incorretos.':error.code==='auth/email-already-in-use'?'Este e-mail já possui senha. Entre ou use “Esqueci a senha”.':error.code==='auth/too-many-requests'?'Muitas tentativas. Aguarde alguns minutos.':error.code?'Não foi possível acessar. Confira os dados e tente novamente.':error.message}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
$('login').onsubmit=event=>{event.preventDefault();run(async()=>{const {auth,sdk}=await firebase(),credentials=await sdk.signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);await sdk.reload(credentials.user);if(!auth.currentUser.emailVerified){await sdk.sendEmailVerification(auth.currentUser);throw Error('Confirme o e-mail pelo link enviado e entre novamente.')}const response=await fetch('/api/account/firebase/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id_token:await auth.currentUser.getIdToken(true)})}),data=await response.json();if(!response.ok)throw Error(data.error||'Peça ao dono para autorizar o e-mail compartilhado.');const modeResponse=await fetch('/api/staff-access/seller-login',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),mode=await modeResponse.json();if(!modeResponse.ok)throw Error(mode.error||'Use o e-mail da equipe desta loja.');const me=await(await fetch('/api/me')).json();if(!['owner','seller'].includes(me.role))throw Error('Este e-mail ainda não foi autorizado pelo dono para realizar vendas.');if(location.origin==='https://mb-for-her.savoryaccordion3.chatgpt.site'){const r=await fetch('/api/staff-access/handoff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({store:'dryfit'})}),transfer=await r.json();if(!r.ok)throw Error(transfer.error||'Não foi possível abrir a MB Dryfit.');const form=document.createElement('form');form.method='POST';form.action=transfer.action;const input=document.createElement('input');input.type='hidden';input.name='ticket';input.value=transfer.ticket;form.append(input);document.body.append(form);form.submit()}else location.href='/vendedor'})};
$('reset').onclick=()=>{if(!$('email').reportValidity()||!$('email').value)return;run(async()=>{const {auth,sdk}=await firebase();await sdk.sendPasswordResetEmail(auth,$('email').value.trim());$('status').textContent='Se houver uma conta, você receberá um link para redefinir a senha.'})};
</script><script>document.addEventListener('DOMContentLoaded',()=>{const field=document.querySelector('input[type=password]');if(!field)return;const button=document.createElement('button');button.type='button';button.className='password-visibility';button.textContent='Mostrar senha';button.setAttribute('aria-pressed','false');button.onclick=()=>{const show=field.type==='password';field.type=show?'text':'password';button.textContent=show?'Ocultar senha':'Mostrar senha';button.setAttribute('aria-pressed',String(show))};field.insertAdjacentElement('afterend',button);const hint=document.createElement('small');hint.className='caps-hint';hint.hidden=true;hint.textContent='Caps Lock está ativado';button.after(hint);field.addEventListener('keyup',e=>{hint.hidden=!e.getModifierState?.('CapsLock')})});</script></body></html>
