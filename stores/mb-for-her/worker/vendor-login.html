<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MB For Her | Acesso dos vendedores</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#10151b;color:#fff;font:14px Arial,sans-serif;padding:22px}.box{width:min(430px,100%);padding:32px;background:#1c232b;border:1px solid #ffffff15;border-radius:16px}.brand{font-size:27px;font-weight:900}.brand b{color:#ff2b97}h1{font-size:28px;margin-top:35px}p{font-size:12px;color:#adb6c1;line-height:1.8}label{display:grid;gap:9px;font-size:12px;margin:20px 0}input{padding:14px;border:1px solid #44515e;border-radius:7px;background:#141b22;color:#fff;font-size:15px;width:100%}button,a{cursor:pointer}button{padding:14px;border:0;border-radius:7px;width:100%;background:#ff2d98;color:#131b22;font-weight:bold}.secondary{background:none;color:#c9d1da;border:1px solid #44515e;margin-top:12px}button:disabled{opacity:.5}a{color:#b7c2ce;font-size:11px;display:inline-block;margin-top:24px}#status{color:#ff7bbe}</style></head><body><main class="box"><div class="brand">MB <b>FOR HER</b></div><h1>Acesso dos vendedores</h1><p>Um acesso para a equipe. Ao finalizar a venda, escolha o nome de quem realizou o atendimento.</p><form id="login"><label>E-mail da equipe desta loja<input value="mbdryfit79@gmail.com" id="email" type="email" autocomplete="username" required maxlength="254"></label><label>Senha<input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required></label><p id="status" role="status"></p><button id="enter">Entrar no ponto de venda</button><button type="button" class="secondary" id="create">Primeiro acesso · criar senha</button><button type="button" class="secondary" id="reset">Esqueci a senha</button></form><a href="/catalogo">Voltar ao catálogo</a><br><a href="https://atelier-loja-mw96xrv3.savoryaccordion3.chatgpt.site/acesso">Escolher modo e loja</a></main><script type="module">
const $=id=>document.getElementById(id);let client;
async function firebase(){if(!client)client=(async()=>{const response=await fetch('/api/account/firebase/config'),{config}=await response.json();if(!config)throw Error('O acesso está em configuração.');const [appSDK,sdk]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js')]);const app=appSDK.getApps().find(a=>a.name==='mb-for-her')||appSDK.initializeApp(config,'mb-for-her'),auth=sdk.getAuth(app);auth.languageCode='pt';return {auth,sdk}})();return client}
async function run(action){$('status').textContent='';document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await action()}catch(error){$('status').textContent=error.code==='auth/invalid-credential'?'E-mail ou senha incorretos.':error.code==='auth/email-already-in-use'?'Este e-mail já possui senha. Entre ou use “Esqueci a senha”.':error.code==='auth/too-many-requests'?'Muitas tentativas. Aguarde alguns minutos.':error.code?'Não foi possível acessar. Confira os dados e tente novamente.':error.message}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
$('login').onsubmit=event=>{event.preventDefault();run(async()=>{await fetch('/api/staff-access/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const {auth,sdk}=await firebase(),credentials=await sdk.signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);await sdk.reload(credentials.user);if(!auth.currentUser.emailVerified){await sdk.sendEmailVerification(auth.currentUser);throw Error('Confirme o e-mail pelo link enviado e entre novamente.')}const response=await fetch('/api/account/firebase/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id_token:await auth.currentUser.getIdToken(true)})}),data=await response.json();if(!response.ok)throw Error(data.error||'Peça ao dono para autorizar o e-mail compartilhado.');const modeResponse=await fetch('/api/staff-access/seller-login',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),mode=await modeResponse.json();if(!modeResponse.ok)throw Error(mode.error||'Use o e-mail da equipe desta loja.');const me=await(await fetch('/api/me')).json();if(!['owner','seller'].includes(me.role))throw Error('Este e-mail ainda não foi autorizado pelo dono para realizar vendas.');location.href='/vendedor'})};
$('create').onclick=()=>{if(!$('login').reportValidity())return;run(async()=>{const {auth,sdk}=await firebase(),credentials=await sdk.createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);await sdk.sendEmailVerification(credentials.user);$('status').textContent='Conta criada. Abra o link enviado ao e-mail compartilhado para confirmar e depois entre com a senha escolhida.'})};
$('reset').onclick=()=>{if(!$('email').reportValidity()||!$('email').value)return;run(async()=>{const {auth,sdk}=await firebase();await sdk.sendPasswordResetEmail(auth,$('email').value.trim());$('status').textContent='Se houver uma conta, você receberá um link para redefinir a senha.'})};
</script></body></html>
