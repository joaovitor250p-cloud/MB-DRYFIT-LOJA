<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>MB For Her | Seu próximo movimento</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#0e1217;color:#f8f7f1;font:14px Arial,sans-serif;display:grid;place-items:center;padding:24px;overflow-x:hidden}.glow{position:fixed;width:650px;height:650px;border-radius:50%;background:radial-gradient(circle,#ff792d15,transparent 65%);right:-220px;top:-150px;pointer-events:none;animation:drift 7s ease-in-out infinite alternate}.card{position:relative;width:min(510px,100%);padding:38px;background:#1b222a;border:1px solid #ffffff18;border-radius:18px;animation:enter .4s ease-out}.brand{font-weight:900;font-size:29px;letter-spacing:-1px}.brand span{color:#ff7b2a}.kicker{color:#a6b0bb;letter-spacing:2px;font-size:8px;margin-top:30px}.icon{display:grid;place-items:center;width:62px;height:62px;margin:25px 0;border:1px solid #ff8b4255;border-radius:50%;background:#ff792d12;color:#ff893e;font-size:28px}h1{font-size:clamp(27px,5vw,36px);letter-spacing:-1px;line-height:1.15;margin:20px 0}p{font-size:12px;line-height:1.9;color:#b7c0ca}label{display:grid;gap:9px;font-size:11px;margin:20px 0}input{width:100%;min-width:0;padding:14px;border:1px solid #45515e;background:#121a22;border-radius:7px;color:#fff;font-size:15px}button,.primary{width:100%;display:block;border:0;border-radius:7px;background:#ff792d;color:#141a21;padding:15px;font-weight:bold;cursor:pointer;text-align:center;text-decoration:none;font-size:12px}.secondary{display:block;padding:14px;border:1px solid #45515e;color:#d4dbe1;text-align:center;text-decoration:none;border-radius:7px;margin-top:10px;font-size:11px}button:disabled{opacity:.5;cursor:default}#error{color:#ffb389}#email{overflow-wrap:anywhere}.foot{padding-top:24px;margin-top:25px;border-top:1px solid #ffffff15;font-size:9px;color:#8f9ca8}.status-line{height:3px;width:55px;background:#ff792d;margin-top:25px;animation:line 1.8s ease-in-out infinite alternate}[hidden]{display:none!important}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes drift{to{transform:translate(-60px,70px)}}@keyframes line{to{width:110px;opacity:.5}}@media(max-width:500px){.card{padding:28px 22px}.brand{font-size:26px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><div class="glow"></div><main class="card"><div class="brand">MB <span>DRYFIT</span></div><div class="kicker">ACESSO SEGURO / VISTA O MOVIMENTO</div><div class="icon" id="icon">↗</div><h1 id="title">Conferindo seu link.</h1><p id="message">Só um instante. Estamos validando sua solicitação.</p><p id="email"></p><form id="passwordForm" hidden><label>Nova senha<input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label><label>Confirme a nova senha<input id="confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label><button>Salvar nova senha</button></form><p id="error" role="alert"></p><div id="links" hidden><a class="primary" href="/catalogo">Entrar no catálogo</a><a class="secondary" href="/vendedor">Sou vendedor · Entrar no PDV</a></div><div class="status-line" id="progress"></div><div class="foot">MB DRYFIT · SPORT &amp; LIFESTYLE<br>Sua senha é processada pelo Firebase e não é exibida à equipe da loja.</div></main><script type="module">
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),mode=params.get('mode'),code=params.get('oobCode');let ownerReset=null;try{const continuation=new URL(params.get('continueUrl'));if(continuation.origin==='https://atelier-loja-mw96xrv3.savoryaccordion3.chatgpt.site'&&continuation.pathname==='/conta/acao'&&/^[a-f0-9]{64}$/.test(continuation.searchParams.get('owner_reset')||''))ownerReset=continuation.searchParams.get('owner_reset')}catch{}history.replaceState(null,'','/conta/acao');
function finished(title,message){$('title').textContent=title;$('message').textContent=message;$('icon').textContent='✓';$('links').hidden=false;$('passwordForm').hidden=true;$('progress').hidden=true}
function failed(error){$('title').textContent='Vamos tentar de novo.';$('message').textContent=['auth/expired-action-code','auth/invalid-action-code'].includes(error.code)?'Esse link já foi usado ou expirou. Volte ao acesso e solicite outro link.':'Não foi possível concluir essa solicitação. Confira o link recebido ou solicite um novo.';$('icon').textContent='!';$('links').hidden=false;$('progress').hidden=true}
(async()=>{try{if(!code||!['resetPassword','verifyEmail','recoverEmail','verifyAndChangeEmail'].includes(mode))throw Error('Link inválido');const response=await fetch('/api/account/firebase/config'),{config}=await response.json();if(!config)throw Error('Acesso indisponível');const [appSDK,sdk]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js')]),auth=sdk.getAuth(appSDK.initializeApp(config,'mb-email-actions'));auth.languageCode='pt';
if(mode==='resetPassword'){const email=await sdk.verifyPasswordResetCode(auth,code);$('title').textContent='Nova senha.\nNovo movimento.';$('message').textContent='Crie uma senha com pelo menos 8 caracteres para voltar ao seu espaço na MB.';$('email').textContent=email;if(ownerReset){$('message').textContent='Defina a nova senha de acesso do dono.';$('links').innerHTML='<a class="primary" href="/dono">Entrar</a>';document.querySelector('.foot').textContent='MB · Acesso do dono';}$('passwordForm').hidden=false;$('progress').hidden=true;$('passwordForm').onsubmit=async event=>{event.preventDefault();$('error').textContent='';if($('password').value!==$('confirm').value){$('error').textContent='As senhas precisam ser iguais.';return}const button=event.target.querySelector('button');button.disabled=true;try{if(ownerReset){const response=await fetch('/api/owner-access/reset-confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:ownerReset,code,password:$('password').value})}),result=await response.json();if(!response.ok)throw Error(result.error||'Não foi possível salvar. Solicite outro link.')}else await sdk.confirmPasswordReset(auth,code,$('password').value);$('password').value='';$('confirm').value='';finished('Senha atualizada.','Tudo certo. Você já pode entrar com sua nova senha.')}catch(error){$('error').textContent=error.code==='auth/weak-password'?'Escolha uma senha mais forte.':error.message||'Não foi possível salvar. O link pode ter expirado; solicite outro.'}finally{button.disabled=false}};
}else{await sdk.checkActionCode(auth,code);await sdk.applyActionCode(auth,code);finished(mode==='recoverEmail'?'E-mail restaurado.':'E-mail confirmado.',mode==='recoverEmail'?'Seu e-mail anterior foi restaurado. Por segurança, considere trocar sua senha.':'Seu acesso foi confirmado. Volte à aba de cadastro e toque em “Já confirmei meu e-mail”, ou entre com seu e-mail e senha.')}}catch(error){failed(error)}})();
</script></body></html>
