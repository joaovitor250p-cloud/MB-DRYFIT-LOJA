<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MB For Her | Login do dono</title><style>:root{--accent:#ed087e}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:#11151a;color:#edf0f3;font:14px Arial,sans-serif}.box{width:min(420px,100%);padding:34px;border:1px solid #ffffff16;border-radius:18px;background:#1c232b}.brand{font-size:28px;font-weight:900;letter-spacing:-1px;margin-bottom:30px}.brand b{color:var(--accent)}label{display:grid;gap:9px;font-size:12px;margin:20px 0}input{width:100%;min-width:0;padding:14px;border:1px solid #44515e;border-radius:7px;background:#131a21;color:white;font:16px Arial,sans-serif}button{cursor:pointer}button[type=submit]{width:100%;padding:15px;border:0;border-radius:7px;background:var(--accent);color:#11151a;font-weight:700;font-size:14px}.forgot{display:block;margin:20px auto 0;border:0;padding:5px;background:none;color:#c3ccd6;font-size:12px;text-decoration:underline;text-underline-offset:4px}button:disabled{opacity:.5;cursor:wait}.status{font-size:12px;color:#f2bca0;line-height:1.8;margin:14px 0;overflow-wrap:anywhere}.status:empty{display:none}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}[hidden]{display:none!important}@media(max-width:480px){.box{padding:28px 23px}}/*__ENTRY_LAYOUT__*/
</style></head><body class="staff-login"><main class="box" aria-label="Login do dono"><div class="brand">MB <b>FOR HER</b></div><form id="accountForm"><label>E-mail<input id="email" value="__STAFF_LOGIN_EMAIL__" type="email" maxlength="254" autocomplete="username" required></label><label>Senha<input id="accountPassword" type="password" minlength="8" maxlength="128" autocomplete="current-password" required></label><button type="submit">Entrar</button><button type="button" class="forgot" id="reset">Esqueci minha senha</button></form><p id="error" class="status" role="status" aria-live="polite"></p></main><script type="module">
const $=id=>document.getElementById(id);if(new URLSearchParams(location.search).get('loja')==='her'){document.documentElement.style.setProperty('--accent','#ed087e');document.querySelector('.brand').innerHTML='MB <b>FOR HER</b>';document.title='MB For Her | Login do dono'}const ownerDestination=()=>new URLSearchParams(location.search).get('loja')==='her'?'/acesso?modo=dono&loja=her&continuar=1':'/gestao';
async function api(path,data){const r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined}),body=await r.json();if(!r.ok)throw Error(body.error||'Não foi possível continuar.');return body}
$('accountForm').onsubmit=async event=>{event.preventDefault();const button=event.target.querySelector('button');button.disabled=true;$('error').textContent='';try{await api('owner-access/login',{email:$('email').value.trim(),password:$('accountPassword').value});$('accountPassword').value='';location.replace(ownerDestination())}catch(error){$('accountPassword').value='';$('error').textContent=error.message}finally{button.disabled=false}};
$('reset').onclick=async()=>{if(!$('email').reportValidity()||!$('email').value)return;const button=$('reset');button.disabled=true;$('error').textContent='';try{await api('owner-access/reset-request',{email:$('email').value.trim()});$('error').textContent='Se o e-mail estiver cadastrado como dono, você receberá um link para redefinir a senha.'}catch(error){$('error').textContent=error.message}finally{button.disabled=false}};
(async()=>{try{const current=await api('me');if(current.role==='owner'&&current.owner_access===true)location.replace(ownerDestination());else if(current.role==='seller'){$('error').textContent='Você está no modo vendedor. Saia da conta pelo painel para entrar como dono.';$('accountForm').hidden=true}}catch{}})();
</script></body></html>
