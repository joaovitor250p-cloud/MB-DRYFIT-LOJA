<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MB For Her | Login do dono</title><style>:root{--accent:#ed087e}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:#11151a;color:#edf0f3;font:14px Arial,sans-serif}.box{width:min(420px,100%);padding:34px;border:1px solid #ffffff16;border-radius:18px;background:#1c232b}.brand{font-size:28px;font-weight:900;letter-spacing:-1px;margin-bottom:30px}.brand b{color:var(--accent)}label{display:grid;gap:9px;font-size:12px;margin:20px 0}input{width:100%;min-width:0;padding:14px;border:1px solid #44515e;border-radius:7px;background:#131a21;color:white;font:16px Arial,sans-serif}button{cursor:pointer}button[type=submit]{width:100%;padding:15px;border:0;border-radius:7px;background:var(--accent);color:#11151a;font-weight:700;font-size:14px}.forgot{display:block;margin:20px auto 0;border:0;padding:5px;background:none;color:#c3ccd6;font-size:12px;text-decoration:underline;text-underline-offset:4px}button:disabled{opacity:.5;cursor:wait}.status{font-size:12px;color:#f2bca0;line-height:1.8;margin:14px 0;overflow-wrap:anywhere}.status:empty{display:none}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}[hidden]{display:none!important}@media(max-width:480px){.box{padding:28px 23px}}/*__ENTRY_LAYOUT__*/
</style></head><body class="staff-login"><main class="box" aria-label="Login do dono"><aside class="login-story"><div class="brand">MB <b>DRYFIT</b></div><h1>Seu negócio.<br>Sua melhor fase.</h1><p>MB Dryfit e MB For Her. Cada loja com sua identidade, tudo conectado à sua rotina.</p><div class="brand-stores"><span><i></i>MB DRYFIT</span><span class="her"><i></i>MB FOR HER</span></div></aside><section class="login-fields"><a class="selection-back" href="/acesso">← Voltar à seleção</a><span class="section-label">MODO DONO</span><h2>Bem-vindo à sua gestão</h2><p>Entre com seu acesso administrativo.</p><form id="accountForm"><label>E-mail<input id="email" value="__STAFF_LOGIN_EMAIL__" type="email" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="254" autocomplete="username" required></label><label>Senha<input id="accountPassword" type="password" minlength="8" maxlength="128" autocomplete="current-password" required></label><button type="submit">Entrar</button><button type="button" class="forgot" id="reset">Esqueci minha senha</button></form><p id="error" class="status" role="status" aria-live="polite"></p></section></main><script type="module">
const $=id=>document.getElementById(id);let ownerBusy=false;const ownerDestination=()=>'/gestao';
async function finishOwnerLogin(){const target=new URLSearchParams(location.search).get('loja');if(target!=='her'){location.replace(ownerDestination());return}const data=await api('staff-access/handoff',{store:'her'});if(data.action!=='https://mb-for-her.savoryaccordion3.chatgpt.site/acesso/continuar'||typeof data.ticket!=='string')throw Error('Não foi possível retomar a loja selecionada. Sua sessão de dono está ativa na MB Dryfit.');const form=document.createElement('form');form.method='POST';form.action=data.action;const field=document.createElement('input');field.type='hidden';field.name='ticket';field.value=data.ticket;form.append(field);document.body.append(form);form.submit()}

async function api(path,data){const r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined}),body=await r.json();if(!r.ok)throw Object.assign(Error(body.error||'Não foi possível continuar.'),{status:r.status});return body}
$('accountForm').onsubmit=async event=>{event.preventDefault();if(ownerBusy)return;ownerBusy=true;const button=event.target.querySelector('button');button.disabled=true;$('reset').disabled=true;button.textContent='Entrando…';$('accountForm').setAttribute('aria-busy','true');$('error').dataset.state='loading';$('accountPassword').removeAttribute('aria-invalid');$('error').textContent='Conferindo seu acesso…';try{await api('owner-access/login',{email:$('email').value.trim(),password:$('accountPassword').value});$('accountPassword').value='';$('error').dataset.state='success';$('error').textContent='Acesso confirmado. Abrindo sua gestão…';await finishOwnerLogin()}catch(error){$('accountPassword').value='';$('error').dataset.state='error';$('error').textContent=error.message;if(error.status===401)$('accountPassword').setAttribute('aria-invalid','true')}finally{ownerBusy=false;button.disabled=false;$('reset').disabled=false;button.textContent='Entrar';$('accountForm').setAttribute('aria-busy','false')}};
$('reset').onclick=async()=>{if(ownerBusy)return;if(!$('email').reportValidity()||!$('email').value)return;ownerBusy=true;const button=$('reset');button.disabled=true;$('error').textContent='';try{await api('owner-access/reset-request',{email:$('email').value.trim()});$('error').textContent='Se o e-mail estiver cadastrado como dono, você receberá um link para redefinir a senha.'}catch(error){$('error').textContent=error.message}finally{ownerBusy=false;button.disabled=false}};
(async()=>{try{const current=await api('me');if(current.role==='owner'&&current.owner_access===true)await finishOwnerLogin();else if(current.role==='seller'){$('error').textContent='Esta sessão está no modo vendedor. Informe a senha exclusiva do dono para entrar no modo dono. O e-mail, sozinho, não libera a gestão.';$('accountForm').hidden=false}}catch{}})();
</script><script>document.addEventListener('DOMContentLoaded',()=>{if(new URLSearchParams(location.search).get('loja')==='her')document.body.dataset.store='her';const field=document.querySelector('input[type=password]');if(!field)return;const button=document.createElement('button');button.type='button';button.className='password-visibility';button.textContent='Mostrar senha';button.setAttribute('aria-pressed','false');button.onclick=()=>{const show=field.type==='password';field.type=show?'text':'password';button.textContent=show?'Ocultar senha':'Mostrar senha';button.setAttribute('aria-pressed',String(show));field.focus({preventScroll:true})};field.insertAdjacentElement('afterend',button);const hint=document.createElement('small');hint.className='caps-hint';hint.hidden=true;hint.textContent='Caps Lock está ativado';button.after(hint);field.addEventListener('keyup',e=>{hint.hidden=!e.getModifierState?.('CapsLock')})});</script></body></html>
